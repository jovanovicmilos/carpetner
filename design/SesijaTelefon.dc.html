<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Zajednička sesija na telefonu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#F3F1EC}</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B19; width: 1300px; height: 900px; box-sizing: border-box; padding: 28px; display: flex; gap: 32px; align-items: flex-start; background: #F3F1EC">
  <sc-for list="{{phones}}" as="ph" hint-placeholder-count="3">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; align-items: center">
      <div style="width: 390px; height: 790px; border-radius: 28px; overflow: hidden; border: 1px solid #CFC7B8; background: #FAF8F4; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(28,27,25,0.12); position: relative">
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #1F2B24; color: #F3F1EC">
          <svg width="22" height="22" viewBox="0 0 28 28" aria-hidden="true"><path d="M11.2 25.4c1.3-.5 2-1.8 2.1-3.8l.1-4.3h1.2l.1 4.3c.1 2 .8 3.3 2.1 3.8z" fill="#C49A6C"></path><path d="M13.9 18.4 10.6 16M14 18v-2.4M14.4 18.3l3.4-2.5" fill="none" stroke="#C49A6C" stroke-width="1.1" stroke-linecap="round"></path><path d="M9.6 25.4h8.8" stroke="#C49A6C" stroke-width="1.2" stroke-linecap="round"></path><path d="M3.6 15.2a2.6 2.6 0 0 1 .6-4.6a3 3 0 0 1 3.4-4.2a3.4 3.4 0 0 1 5-2.6a3.4 3.4 0 0 1 5.2.6a3 3 0 0 1 4 3.4a2.8 2.8 0 0 1 2.4 4a2.4 2.4 0 0 1-.4 4.2a2.6 2.6 0 0 1-4 .8a2.4 2.4 0 0 1-3.4.4a2.4 2.4 0 0 1-3.6 0a2.4 2.4 0 0 1-3.4-.4a2.6 2.6 0 0 1-4-.8a1.8 1.8 0 0 1-1.8-.8z" fill="#5E9B74"></path><path d="M3.9 12.9a2.6 2.6 0 0 1 .3-2.3a3 3 0 0 1 3.4-4.2a3.4 3.4 0 0 1 5-2.6a3.4 3.4 0 0 1 5.2.6a3 3 0 0 1 4 3.4a2.8 2.8 0 0 1 2.4 4a2.2 2.2 0 0 1-.3 1.4c-1-.7-2.3-.6-3.1.2c-.9-.8-2.4-.8-3.3 0c-1-.9-2.6-.9-3.6 0c-.9-.8-2.4-.8-3.3 0c-.8-.8-2.1-.9-3.1-.2c-.8-.4-1.4-.4-1.9-.2z" fill="#8CC5A2"></path><path d="M7.2 9.2a2.2 2.2 0 0 1 2.4-2.4a2.6 2.6 0 0 1 4.2-1.4a2.4 2.4 0 0 1 2.6.2c-1.6.2-2.6 1-3 2.2c-1.4-.6-3 0-3.6 1.4c-1-.4-2-.4-2.6 0z" fill="#B5DCC2"></path></svg>
          <span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 12px; color: #D8D3C9">Korak 1 od 4</span><strong style="font-size: 15px">Prostor</strong></span>
          <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 14px; background: #26352C; border: 1px solid #3E5045; font-size: 12px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3FB06A; margin-left: 4px"></span><span style="width: 22px; height: 22px; border-radius: 50%; background: #6B4A33; display: inline-flex; align-items: center; justify-content: center; font-size: 9.5px">PS</span>Uživo</span>
        </div>
        <div style="flex: 1; position: relative; background-color: #FAF8F4; background-image: linear-gradient(#E4DFD5 1px, transparent 1px), linear-gradient(90deg, #E4DFD5 1px, transparent 1px); background-size: 30px 30px; overflow: hidden">
          <svg viewBox="0 0 360 330" role="img" aria-label="Plan: ugaona kuhinja" style="position: absolute; left: 6px; top: 20px; width: 310px; height: 284px">
            <path d="M20 320V20H350" fill="none" stroke="#1C1B19" stroke-width="7"></path>
            <rect x="23" y="23" width="96" height="58" fill="#EADBC4" stroke="#1C1B19" stroke-width="1"></rect>
            <rect x="119" y="23" width="77" height="58" fill="#C9DAF2" stroke="#6B4A33" stroke-width="3"></rect>
            <rect x="196" y="23" width="58" height="58" fill="#FFFFFF" stroke="#1C1B19" stroke-width="1"></rect>
            <rect x="254" y="23" width="48" height="58" fill="#E2EFE6" stroke="#2E6B4E" stroke-width="3"></rect>
            <rect x="23" y="81" width="58" height="58" fill="#3A3936" stroke="#1C1B19" stroke-width="1"></rect>
            <rect x="23" y="139" width="58" height="58" fill="#EADBC4" stroke="#1C1B19" stroke-width="1"></rect>
            <rect x="23" y="197" width="58" height="58" fill="#D6BE98" stroke="#1C1B19" stroke-width="1"></rect>
            <text x="157" y="57" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="600">D2</text>
            <text x="278" y="57" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="600">D4</text>
            <rect x="119" y="88" width="104" height="20" rx="10" fill="#6B4A33"></rect>
            <text x="171" y="102" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10.5" font-weight="600" fill="#FFFFFF">Petar · pomerio</text>
          </svg>
          <sc-if value="{{ph.toast}}" hint-placeholder-val="{{ true }}"><div role="status" style="position: absolute; left: 10px; right: 10px; top: 10px; display: flex; align-items: center; gap: 8px; background: #1F2B24; color: #F3F1EC; border-radius: 10px; padding: 8px 10px; font-size: 13px"><span style="width: 22px; height: 22px; border-radius: 50%; background: #6B4A33; border: 1.5px solid #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font: 700 9.5px 'IBM Plex Sans', sans-serif">PS</span><span style="flex: 1">Petar je pomerio Sudoperu 20 cm</span><span style="color: #8CC5A2; font-weight: 600">Prikaži</span></div></sc-if>
          <sc-if value="{{ph.head}}" hint-placeholder-val="{{ true }}"><div aria-label="Poruke sa Petrom, 2 nove (prevuci da pomeriš)" style="{{ph.headBox}}"><sc-if value="{{ph.peek}}" hint-placeholder-val="{{ true }}"><span style="max-width: 200px; background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 14px 14px 4px 14px; padding: 7px 10px; font-size: 12.5px; line-height: 1.3; box-shadow: 0 4px 14px rgba(28,27,25,0.14)">Može, pomeram je — odvod je na 145 cm.</span></sc-if><span style="position: relative; display: inline-flex"><span style="position: relative; display: inline-flex"><span style="width: 56px; height: 56px; border-radius: 50%; background: #6B4A33; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font: 700 15px 'IBM Plex Sans', sans-serif; box-shadow: 0 4px 14px rgba(28,27,25,0.28); border: 2px solid #FFFFFF">PS</span><span style="position: absolute; right: 1px; bottom: 1px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #FFFFFF; background: #3FB06A"></span></span><sc-if value="{{ph.badge}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; right: -4px; top: -4px; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #B4440E; color: #FFFFFF; border: 2px solid #FFFFFF; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">2</span></sc-if></span></div></sc-if>
          <sc-if value="{{ph.drag}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(transparent, rgba(28,27,25,0.35)); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 18px; box-sizing: border-box"><span style="width: 52px; height: 52px; border-radius: 50%; background: #FFFFFF; border: 2px solid #1C1B19; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600">×</span></div></sc-if>
        </div>
        <div style="{{ph.sheet}}">
          <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #DDD8CE"></span>
          <sc-if value="{{ph.isEl}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; align-items: center; gap: 10px"><strong style="font-size: 16px">D4 Fioke</strong><span style="margin-left: auto; display: flex; align-items: center; gap: 6px"><span style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #BDB5A6; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600">−</span><span style="font: 600 16px 'IBM Plex Mono', monospace; min-width: 58px; text-align: center">50 cm</span><span style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #BDB5A6; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600">+</span></span></div>
            <div style="display: flex; gap: 8px"><span style="flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid #BDB5A6; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">Zameni</span><span style="flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid #BDB5A6; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">Obriši</span><span style="flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid #2E6B4E; color: #1D4632; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">Komentar</span></div>
            <div style="display: flex; gap: 8px"><span style="min-height: 48px; padding: 0 16px; border-radius: 10px; border: 1px solid #2E6B4E; color: #1D4632; display: inline-flex; align-items: center; font-weight: 600">+ Dodaj</span><span style="flex: 1; min-height: 48px; border-radius: 10px; background: #2E6B4E; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 600">Dalje: izgled</span></div>
          </sc-if>
        </div>
        <sc-if value="{{ph.modal}}" hint-placeholder-val="{{ false }}"><div role="dialog" aria-modal="true" aria-label="Poruke sa Petrom" style="position: absolute; inset: 0; background: rgba(28,27,25,0.45); display: flex; flex-direction: column; justify-content: flex-end; z-index: 5"><div style="height: 712px; background: #FFFFFF; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; box-sizing: border-box">
          <div style="display: flex; align-items: center; gap: 10px; padding: 12px 10px 12px 14px; border-bottom: 1px solid #EEEAE2"><span style="position: relative; display: inline-flex"><span style="width: 40px; height: 40px; border-radius: 50%; background: #6B4A33; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font: 700 12px 'IBM Plex Sans', sans-serif; border: 0">PS</span><span style="position: absolute; right: 1px; bottom: 1px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #FFFFFF; background: #3FB06A"></span></span><span style="flex: 1; display: flex; flex-direction: column; line-height: 1.25"><strong style="font-size: 15px">Petar Stanić</strong><span style="font-size: 12.5px; color: #5F5A52">Radionica Hrast · u kuhinji je</span></span><span aria-label="Zatvori poruke" style="width: 44px; height: 44px; border-radius: 50%; background: #F3F1EC; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="#1C1B19" stroke-width="1.9" stroke-linecap="round"></path></svg></span></div>
          <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px; overflow: hidden">
            <span style="align-self: center; font-size: 11.5px; color: #8A8378">Danas 12:04</span>
            <span style="align-self: flex-end; max-width: 78%; font-size: 14px; background: #2E6B4E; color: #FFFFFF; border-radius: 16px 16px 4px 16px; padding: 8px 12px">Možemo li sudoperu bliže prozoru?</span>
            <span style="align-self: flex-start; max-width: 78%; font-size: 14px; background: #F3F1EC; border-radius: 16px 16px 16px 4px; padding: 8px 12px">Može, pomeram je — odvod je na 145 cm.</span>
            <span style="align-self: center; font-size: 12px; color: #3D3A35; display: flex; align-items: center; gap: 6px; background: #F7EFE6; border-radius: 10px; padding: 5px 10px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #6B4A33"></span><strong>Petar</strong> pomerio Sudoperu 20 cm · <span style="color: #1D4632; font-weight: 600; text-decoration: underline">Prikaži</span></span>
            <span style="align-self: flex-end; max-width: 78%; display: flex; flex-direction: column; align-items: flex-end; gap: 3px"><span style="font-size: 11px; color: #1D4632; background: #E2EFE6; border-radius: 8px; padding: 2px 8px">Komentar na: D4 Fioke</span><span style="font-size: 14px; background: #2E6B4E; color: #FFFFFF; border-radius: 16px 16px 4px 16px; padding: 8px 12px">Da li 50 cm fioke staju za šerpe?</span></span>
            <span style="font-size: 12.5px; color: #5F5A52">••• Petar piše…</span>
          </div>
          <div style="display: flex; gap: 8px; padding: 10px 12px 14px; border-top: 1px solid #EEEAE2"><span style="flex: 1; min-height: 44px; border-radius: 22px; border: 1px solid #BDB5A6; background: #FFFFFF; display: inline-flex; align-items: center; padding: 0 14px; font-size: 14px; color: #8A8378">Poruka za Petra…</span><span aria-label="Pošalji" style="width: 44px; height: 44px; border-radius: 50%; background: #2E6B4E; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9h11M10 5l4 4-4 4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></div>
        </div></div></sc-if>
      </div>
      <figcaption style="font-size: 14px; color: #3D3A35; text-align: center; max-width: 360px">{{ph.cap}}</figcaption>
    </figure>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1300,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var tab = function (on) { return 'flex: 1; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; ' + (on ? 'font-weight: 600; box-shadow: inset 0 -2px 0 #2E6B4E' : 'color: #5F5A52'); };
    var sheet = function (tall) { return 'background: #FFFFFF; border-top: 1px solid #DDD8CE; border-radius: 16px 16px 0 0; box-shadow: 0 -6px 20px rgba(28,27,25,0.08); padding: 8px 14px 14px; display: flex; flex-direction: column; gap: 10px; ' + (tall ? 'height: 420px; box-sizing: border-box' : ''); };
    var hb = function (pos) { return 'position: absolute; ' + pos + '; display: flex; align-items: center; gap: 8px; z-index: 3'; };
    return { phones: [
      { isEl: true, toast: true, head: true, peek: true, badge: true, drag: false, modal: false, headBox: hb('right: 10px; bottom: 16px'), sheet: sheet(false), cap: 'Poruke su kružić sa slikom (kao Messenger): broj novih i kratak pregled poslednje poruke. Prevuci ga bilo gde uz ivicu da ne smeta planu.' },
      { isEl: true, toast: false, head: true, peek: false, badge: false, drag: false, modal: true, headBox: hb('right: 10px; bottom: 16px'), sheet: sheet(false), cap: 'Dodir na kružić otvara poruke preko celog ekrana; × ih zatvara i vraća kružić tamo gde je bio.' },
      { isEl: true, toast: false, head: true, peek: false, badge: false, drag: true, modal: false, headBox: hb('left: 120px; bottom: 120px'), sheet: sheet(false), cap: 'Dok se kružić vuče, dole se pojavi ×: spusti ga tu da sakriješ poruke do sledeće nove poruke (vraćaju se i iz oznake „Uživo“ gore).' }
    ] };
  }
}
</script>
</body>
</html>
