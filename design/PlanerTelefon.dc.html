<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Planer na telefonu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F1EC}
.k-btn:focus-visible,.k-u:focus-visible{outline:2px solid #2E6B4E;outline-offset:2px}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B19; width: 1300px; height: 900px; box-sizing: border-box; padding: 28px; display: flex; gap: 40px; align-items: flex-start; background: #F3F1EC">
  <sc-for list="{{phones}}" as="ph" hint-placeholder-count="3">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; align-items: center">
      <div style="width: 390px; height: 790px; border-radius: 28px; overflow: hidden; border: 1px solid #CFC7B8; background: #FAF8F4; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(28,27,25,0.12)">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #1F2B24; color: #F3F1EC">
          <svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="3" width="22" height="22" rx="3" fill="none" stroke="#F3F1EC" stroke-width="2"></rect><path d="M3 11h22M11 11v14" stroke="#8CC5A2" stroke-width="2"></path></svg>
          <span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 12px; color: #D8D3C9">Korak {{ph.n}} od 5</span><strong style="font-size: 15px">{{ph.step}}</strong></span>
          <span style="margin-left: auto; display: inline-flex"><span style="width: 26px; height: 26px; border-radius: 50%; background: #2E6B4E; border: 2px solid #1F2B24; color: #FFFFFF; font: 700 11px 'IBM Plex Sans', sans-serif; display: inline-flex; align-items: center; justify-content: center">A</span><sc-if value="{{ph.live}}" hint-placeholder-val="{{ false }}"><span style="margin-left: -8px; width: 26px; height: 26px; border-radius: 50%; background: #6B4A33; border: 2px solid #1F2B24; color: #FFFFFF; font: 700 11px 'IBM Plex Sans', sans-serif; display: inline-flex; align-items: center; justify-content: center">M</span></sc-if></span>
        </div>
        <div aria-hidden="true" style="height: 4px; background: #3E5045"><div style="{{ph.bar}}"></div></div>
        <sc-if value="{{ph.live}}" hint-placeholder-val="{{ false }}"><div style="padding: 7px 14px; background: #E2EFE6; color: #1D4632; font-size: 13px; display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #2E6B4E"></span>Uživo sa Markom (stolar)<span style="margin-left: auto; font-weight: 600">Prati</span></div></sc-if>

        <sc-if value="{{ph.isPlan}}" hint-placeholder-val="{{ true }}">
          <div style="flex: 1; position: relative; background-color: #FAF8F4; background-image: linear-gradient(#E4DFD5 1px, transparent 1px), linear-gradient(90deg, #E4DFD5 1px, transparent 1px); background-size: 30px 30px">
            <svg viewBox="0 0 360 330" role="img" aria-label="Plan: ugaona kuhinja, izabrane fioke 60 cm" style="position: absolute; left: 6px; top: 44px; width: 310px; height: 284px">
              <path d="M20 320V20H350" fill="none" stroke="#1C1B19" stroke-width="7"></path>
              <rect x="23" y="23" width="96" height="58" fill="#EADBC4" stroke="#1C1B19" stroke-width="1"></rect>
              <rect x="119" y="23" width="77" height="58" fill="#C9DAF2" stroke="#6B4A33" stroke-width="2.5"></rect>
              <rect x="196" y="23" width="58" height="58" fill="#FFFFFF" stroke="#1C1B19" stroke-width="1"></rect>
              <rect x="254" y="23" width="58" height="58" fill="#E2EFE6" stroke="#2E6B4E" stroke-width="3"></rect>
              <rect x="23" y="81" width="58" height="58" fill="#EADBC4" stroke="#1C1B19" stroke-width="1"></rect>
              <rect x="23" y="139" width="58" height="58" fill="#EADBC4" stroke="#1C1B19" stroke-width="1"></rect>
              <rect x="23" y="197" width="58" height="58" fill="#D6BE98" stroke="#6B4A33" stroke-width="2.5"></rect>
              <text x="283" y="57" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="600">Fioke 60</text>
              <text x="157" y="57" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="600">Sudopera</text>
            </svg>
            <span style="position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px"><span style="width: 44px; height: 44px; border-radius: 10px; background: #FFFFFF; border: 1px solid #DDD8CE; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">3D</span><span style="width: 44px; height: 44px; border-radius: 10px; background: #FFFFFF; border: 1px solid #DDD8CE; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3L2 6l3 3M2 6h7a4 4 0 0 1 0 8H6" fill="none" stroke="#1C1B19" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></span>
          </div>
          <div style="background: #FFFFFF; border-top: 1px solid #DDD8CE; border-radius: 16px 16px 0 0; box-shadow: 0 -6px 20px rgba(28,27,25,0.08); padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 10px">
            <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #DDD8CE"></span>
            <div style="display: flex; align-items: center; gap: 10px"><strong style="font-size: 17px">Fioke</strong><span style="font-size: 13px; color: #5F5A52">zid A</span>
              <span style="margin-left: auto; display: flex; align-items: center; gap: 6px"><span style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #BDB5A6; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600">−</span><span style="font: 600 17px 'IBM Plex Mono', monospace; min-width: 62px; text-align: center">60 cm</span><span style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #BDB5A6; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600">+</span></span></div>
            <div style="display: flex; gap: 8px"><span style="flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid #BDB5A6; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">Zameni</span><span style="flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid #BDB5A6; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">Obriši</span><span style="flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid #BDB5A6; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">Komentar</span></div>
            <div style="display: flex; gap: 8px"><span style="min-height: 50px; padding: 0 16px; border-radius: 10px; border: 1px solid #2E6B4E; color: #1D4632; display: inline-flex; align-items: center; font-weight: 600; font-size: 15px">+ Dodaj</span><span style="flex: 1; min-height: 50px; border-radius: 10px; background: #2E6B4E; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px">Dalje: izgled</span></div>
          </div>
        </sc-if>

        <sc-if value="{{ph.isWizard}}" hint-placeholder-val="{{ false }}">
          <div style="flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px">
            <h2 style="margin: 0; font-size: 22px">Koliko su dugački zidovi?</h2>
            <p style="margin: 0; font-size: 14.5px; color: #5F5A52">Izmeri metrom od ugla do ugla, uz pod.</p>
            <sc-for list="{{walls}}" as="w" hint-placeholder-count="2">
              <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 500">{{w.l}}</span>
                <span style="display: flex; align-items: center; gap: 8px"><span style="width: 52px; height: 56px; border-radius: 10px; border: 1px solid #BDB5A6; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600">−</span><span style="flex: 1; height: 56px; border-radius: 10px; border: 1px solid #BDB5A6; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font: 600 22px 'IBM Plex Mono', monospace">{{w.v}} cm</span><span style="width: 52px; height: 56px; border-radius: 10px; border: 1px solid #BDB5A6; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600">+</span></span></div>
            </sc-for>
            <svg viewBox="0 0 340 170" role="img" aria-label="Osnova: ugaona 320 × 240" style="width: 100%; height: auto; background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 10px"><path d="M40 160V30H310" fill="none" stroke="#1C1B19" stroke-width="6"></path><path d="M43 33h264v26H43zM43 59h26v98H43z" fill="#EADBC4" stroke="#1C1B19" stroke-width="1"></path><text x="175" y="20" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#5F5A52">A 320</text></svg>
            <div style="margin-top: auto; display: flex; gap: 8px"><span style="min-height: 52px; padding: 0 18px; border-radius: 10px; border: 1px solid #BDB5A6; background: #FFFFFF; display: inline-flex; align-items: center; font-weight: 600">Nazad</span><span style="flex: 1; min-height: 52px; border-radius: 10px; background: #2E6B4E; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">Dalje</span></div>
          </div>
        </sc-if>

        <sc-if value="{{ph.isReview}}" hint-placeholder-val="{{ false }}">
          <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
            <div aria-hidden="true" style="height: 170px; border-radius: 12px; border: 1px solid #DDD8CE; background: linear-gradient(180deg, #F7F4EE 0 50%, #E9E3D8 50% 100%); position: relative"><span style="position: absolute; left: 8%; right: 30%; top: 14%; height: 22%; background: #FFFFFF; border: 1px solid #CFC7B8"></span><span style="position: absolute; left: 8%; right: 30%; top: 52%; height: 4%; background: #C49A6C"></span><span style="position: absolute; left: 8%; right: 30%; top: 56%; height: 30%; background: #FFFFFF; border: 1px solid #CFC7B8"></span><span style="position: absolute; right: 10%; top: 10%; width: 14%; bottom: 14%; background: #FFFFFF; border: 1px solid #CFC7B8"></span></div>
            <div style="background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 10px; padding: 12px"><div style="font-size: 13px; color: #5F5A52">Primer cene</div><div style="font: 700 18px 'IBM Plex Mono', monospace">240.000 – 290.000 RSD</div><div style="font-size: 12.5px; color: #3D3A35">Nije ponuda.</div></div>
            <div style="font-size: 15px; font-weight: 600">Ko vidi ovu kuhinju</div>
            <div style="border: 2px solid #2E6B4E; background: #F2F8F4; border-radius: 10px; padding: 10px 12px; font-size: 14px"><strong>Javno</strong> · besplatno<br><span style="font-size: 13px; color: #3D3A35">u galeriji, bez ličnih podataka</span></div>
            <div style="border: 1px solid #DDD8CE; background: #FFFFFF; border-radius: 10px; padding: 10px 12px; font-size: 14px"><strong>Privatno</strong> · uz Plus ili [CENA]</div>
            <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px"><span style="min-height: 50px; border-radius: 10px; border: 1px solid #BDB5A6; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 600">Nastavi sa Google nalogom</span><span style="min-height: 52px; border-radius: 10px; background: #2E6B4E; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">Sačuvaj kuhinju</span></div>
          </div>
        </sc-if>
      </div>
      <figcaption style="font-size: 14px; color: #3D3A35; text-align: center; max-width: 360px">{{ph.cap}}</figcaption>
    </figure>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1300,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var bar = function (n) { return 'height: 100%; width: ' + (n * 20) + '%; background: #8CC5A2'; };
    return {
      walls: [{ l: 'Zid A (glavni)', v: '320' }, { l: 'Zid B (levo od ugla)', v: '240' }],
      phones: [
        { n: '1', step: 'Prostor', bar: bar(1), live: false, isWizard: true, isPlan: false, isReview: false, cap: 'Vodič: jedno pitanje po ekranu, velika dugmad −/+, osnova se crta dok odgovaraš.' },
        { n: '2', step: 'Raspored', bar: bar(2), live: true, isWizard: false, isPlan: true, isReview: false, cap: 'Plan preko celog ekrana; izabrani element u donjem listu (−/+, zameni, obriši, komentar). Sesija sa stolarom radi i na telefonu.' },
        { n: '4', step: 'Pregled', bar: bar(4), live: false, isWizard: false, isPlan: false, isReview: true, cap: 'Pregled: slika, primer cene, javno / privatno, nalog jednim dodirom.' }
      ]
    };
  }
}
</script>
</body>
</html>
