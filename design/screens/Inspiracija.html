<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspiracija — kuhinje iz Kroja</title>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F4}
a{color:#2E6B4E}a:hover{color:#1D4632}
.k-nav{color:#1C1B19;text-decoration:none;font-size:15px;font-weight:500;padding:8px 10px;border-radius:6px}
.k-nav:hover{background:#EEEAE2;color:#1C1B19}
.k-nav:focus-visible,.k-btn:focus-visible,.k-card:focus-visible{outline:2px solid #2E6B4E;outline-offset:2px}
.k-card{text-decoration:none;color:#1C1B19}
.k-card:hover .k-img{transform:scale(1.02)}
.k-img{transition:transform .2s}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B19; background: #FAF8F4; min-height: 1480px">

<header style="position: sticky; top: 0; z-index: 5; background: rgba(250,248,244,0.95); border-bottom: 1px solid #E4DFD5">
  <div style="max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px">
    <a href="Pocetna.html" aria-label="Kroj — početna" style="display: flex; align-items: center; gap: 10px; color: #1C1B19; text-decoration: none">
      <svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><path d="M11.2 25.4c1.3-.5 2-1.8 2.1-3.8l.1-4.3h1.2l.1 4.3c.1 2 .8 3.3 2.1 3.8z" fill="#6B4A33"></path><path d="M13.9 18.4 10.6 16M14 18v-2.4M14.4 18.3l3.4-2.5" fill="none" stroke="#6B4A33" stroke-width="1.1" stroke-linecap="round"></path><path d="M9.6 25.4h8.8" stroke="#6B4A33" stroke-width="1.2" stroke-linecap="round"></path><path d="M3.6 15.2a2.6 2.6 0 0 1 .6-4.6a3 3 0 0 1 3.4-4.2a3.4 3.4 0 0 1 5-2.6a3.4 3.4 0 0 1 5.2.6a3 3 0 0 1 4 3.4a2.8 2.8 0 0 1 2.4 4a2.4 2.4 0 0 1-.4 4.2a2.6 2.6 0 0 1-4 .8a2.4 2.4 0 0 1-3.4.4a2.4 2.4 0 0 1-3.6 0a2.4 2.4 0 0 1-3.4-.4a2.6 2.6 0 0 1-4-.8a1.8 1.8 0 0 1-1.8-.8z" fill="#1D4632"></path><path d="M3.9 12.9a2.6 2.6 0 0 1 .3-2.3a3 3 0 0 1 3.4-4.2a3.4 3.4 0 0 1 5-2.6a3.4 3.4 0 0 1 5.2.6a3 3 0 0 1 4 3.4a2.8 2.8 0 0 1 2.4 4a2.2 2.2 0 0 1-.3 1.4c-1-.7-2.3-.6-3.1.2c-.9-.8-2.4-.8-3.3 0c-1-.9-2.6-.9-3.6 0c-.9-.8-2.4-.8-3.3 0c-.8-.8-2.1-.9-3.1-.2c-.8-.4-1.4-.4-1.9-.2z" fill="#2E6B4E"></path><path d="M7.2 9.2a2.2 2.2 0 0 1 2.4-2.4a2.6 2.6 0 0 1 4.2-1.4a2.4 2.4 0 0 1 2.6.2c-1.6.2-2.6 1-3 2.2c-1.4-.6-3 0-3.6 1.4c-1-.4-2-.4-2.6 0z" fill="#4F8B67"></path></svg>
      <span style="font-weight: 700; font-size: 20px">Kroj</span>
    </a>
    <nav aria-label="Sajt" style="display: flex; flex-wrap: wrap; gap: 2px">
      <a class="k-nav" href="Inspiracija.html" aria-current="page" style="background: #E2EFE6; color: #1D4632">Inspiracija</a>
      <a class="k-nav" href="#kako">Kako radi</a>
      <a class="k-nav" href="ZaStolare.html">Za stolare</a>
      <a class="k-nav" href="ZaStolare.html#cene">Cene</a>
      <a class="k-nav" href="Radionice.html">Radionice</a>
    </nav>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 10px">
      <a class="k-nav" href="Prijava.html">Prijava</a>
      <a href="KupacStart.html" style="min-height: 42px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 8px; background: #2E6B4E; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">Napravi svoju kuhinju</a>
    </div>
  </div>
</header>

<main style="max-width: 1240px; margin: 0 auto; padding: 36px 24px 56px; display: flex; flex-direction: column; gap: 20px">
  <div>
    <h1 style="margin: 0; font-size: 40px">Inspiracija</h1>
    <p style="margin: 6px 0 0; font-size: 17px; color: #3D3A35">Prave kuhinje iz planera — napravili su ih ljudi i radionice. Otvori bilo koju u 3D ili napravi sličnu za svoj prostor.</p>
  </div>
  <div role="toolbar" aria-label="Filteri" style="position: sticky; top: 66px; z-index: 3; background: #FAF8F4; padding: 8px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; border-bottom: 1px solid #E4DFD5">
    <span role="radiogroup" aria-label="Oblik" style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{shapes}}" as="f" hint-placeholder-count="5"><button type="button" role="radio" class="k-btn" aria-checked="{{f.on}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.text}}</button></sc-for>
    </span>
    <span role="radiogroup" aria-label="Stil" style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{styles}}" as="f" hint-placeholder-count="4"><button type="button" role="radio" class="k-btn" aria-checked="{{f.on}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.text}}</button></sc-for>
    </span>
    <label style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; min-height: 40px"><input type="checkbox" checked="{{built}}" onChange="{{toggleBuilt}}" style="width: 18px; height: 18px; accent-color: #2E6B4E">Samo izrađene</label>
    <span style="margin-left: auto; font-size: 14px; color: #5F5A52">{{count}}</span>
  </div>
  <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px">
    <sc-for list="{{cards}}" as="k" hint-placeholder-count="8">
      <li style="display: flex; flex-direction: column; gap: 10px">
        <a href="Kuhinja.html" class="k-card" style="display: flex; flex-direction: column; gap: 10px">
          <span style="display: block; height: 190px; border-radius: 12px; overflow: hidden; border: 1px solid #E4DFD5"><span class="k-img" aria-hidden="true" style="{{k.img}}"><span style="{{k.up}}"></span><span style="{{k.top}}"></span><span style="{{k.low}}"></span><span style="{{k.tall}}"></span></span></span>
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">{{k.t}}</span><span style="font-size: 13.5px; color: #5F5A52">{{k.m}}</span></span>
        </a>
        <span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
          <sc-if value="{{k.by}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12.5px; padding: 2px 8px; border-radius: 10px; background: #F6EEE2; color: #3A2A1F">{{k.byText}}</span></sc-if>
          <a href="Planer.html" style="margin-left: auto; font-size: 14px; font-weight: 600; min-height: 32px; display: inline-flex; align-items: center">Napravi ovakvu</a>
        </span>
      </li>
    </sc-for>
  </ul>
  <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
    <div style="padding: 40px; text-align: center; background: #FFFFFF; border: 1px dashed #BDB5A6; border-radius: 12px; font-size: 16px; color: #3D3A35">Nema kuhinja za ove filtere. <button type="button" class="k-btn" onClick="{{reset}}" style="border: 0; background: transparent; color: #2E6B4E; text-decoration: underline; font: 600 16px 'IBM Plex Sans', sans-serif; cursor: pointer; min-height: 32px">Poništi filtere</button></div>
  </sc-if>
  <div style="display: flex; justify-content: center"><button type="button" class="k-btn" style="min-height: 48px; padding: 0 24px; border-radius: 8px; border: 1px solid #BDB5A6; background: #FFFFFF; color: #1C1B19; font: 600 15px 'IBM Plex Sans', sans-serif; cursor: pointer">Učitaj još</button></div>
  <p style="margin: 0; font-size: 13px; color: #5F5A52; text-align: center">Javne kuhinje ne prikazuju lične podatke. Vidiš nešto neprikladno? Prijavi sa stranice kuhinje.</p>
</main>
<footer style="border-top: 1px solid #E4DFD5; background: #F3F1EC">
  <div style="max-width: 1240px; margin: 0 auto; padding: 32px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; font-size: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px"><strong>Kroj</strong><span style="color: #5F5A52">Kuhinje po meri, od crteža do stolara.</span></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><strong>Za kuću</strong><a href="KupacStart.html">Napravi kuhinju</a><a href="Inspiracija.html">Inspiracija</a><a href="Radionice.html">Radionice</a></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><strong>Za stolare</strong><a href="ZaStolare.html">Kako radi</a><a href="ZaStolare.html#cene">Cene</a><a href="Prijava.html">Prijava</a></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><strong>Kroj</strong><a href="#">Uslovi</a><a href="#">Privatnost</a><a href="#">Kontakt</a></div>
  </div>
</footer>
</div>
</script>

</body>
</html>
