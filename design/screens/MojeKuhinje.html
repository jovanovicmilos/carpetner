<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moje kuhinje — Kroj</title>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F4}
a{color:#2E6B4E}a:hover{color:#1D4632}
.k-nav{color:#1C1B19;text-decoration:none;font-size:15px;font-weight:500;padding:8px 10px;border-radius:6px}
.k-nav:hover{background:#EEEAE2;color:#1C1B19}
.k-nav:focus-visible,.k-btn:focus-visible,.k-card:focus-visible{outline:2px solid #2E6B4E;outline-offset:2px}
.k-card{text-decoration:none;color:#1C1B19}
.k-card:hover .k-img{transform:scale(1.02)}
.k-img{transition:transform .2s}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B19; background: #FAF8F4; min-height: 920px">

<header style="position: sticky; top: 0; z-index: 5; background: rgba(250,248,244,0.95); border-bottom: 1px solid #E4DFD5">
  <div style="max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px">
    <a href="Pocetna.html" aria-label="Kroj — početna" style="display: flex; align-items: center; gap: 10px; color: #1C1B19; text-decoration: none">
      <svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><path d="M11.2 25.4c1.3-.5 2-1.8 2.1-3.8l.1-4.3h1.2l.1 4.3c.1 2 .8 3.3 2.1 3.8z" fill="#6B4A33"></path><path d="M13.9 18.4 10.6 16M14 18v-2.4M14.4 18.3l3.4-2.5" fill="none" stroke="#6B4A33" stroke-width="1.1" stroke-linecap="round"></path><path d="M9.6 25.4h8.8" stroke="#6B4A33" stroke-width="1.2" stroke-linecap="round"></path><path d="M3.6 15.2a2.6 2.6 0 0 1 .6-4.6a3 3 0 0 1 3.4-4.2a3.4 3.4 0 0 1 5-2.6a3.4 3.4 0 0 1 5.2.6a3 3 0 0 1 4 3.4a2.8 2.8 0 0 1 2.4 4a2.4 2.4 0 0 1-.4 4.2a2.6 2.6 0 0 1-4 .8a2.4 2.4 0 0 1-3.4.4a2.4 2.4 0 0 1-3.6 0a2.4 2.4 0 0 1-3.4-.4a2.6 2.6 0 0 1-4-.8a1.8 1.8 0 0 1-1.8-.8z" fill="#1D4632"></path><path d="M3.9 12.9a2.6 2.6 0 0 1 .3-2.3a3 3 0 0 1 3.4-4.2a3.4 3.4 0 0 1 5-2.6a3.4 3.4 0 0 1 5.2.6a3 3 0 0 1 4 3.4a2.8 2.8 0 0 1 2.4 4a2.2 2.2 0 0 1-.3 1.4c-1-.7-2.3-.6-3.1.2c-.9-.8-2.4-.8-3.3 0c-1-.9-2.6-.9-3.6 0c-.9-.8-2.4-.8-3.3 0c-.8-.8-2.1-.9-3.1-.2c-.8-.4-1.4-.4-1.9-.2z" fill="#2E6B4E"></path><path d="M7.2 9.2a2.2 2.2 0 0 1 2.4-2.4a2.6 2.6 0 0 1 4.2-1.4a2.4 2.4 0 0 1 2.6.2c-1.6.2-2.6 1-3 2.2c-1.4-.6-3 0-3.6 1.4c-1-.4-2-.4-2.6 0z" fill="#4F8B67"></path></svg>
      <span style="font-weight: 700; font-size: 20px">Kroj</span>
    </a>
    <nav aria-label="Sajt" style="display: flex; flex-wrap: wrap; gap: 2px">
      <a class="k-nav" href="Inspiracija.html">Inspiracija</a>
      <a class="k-nav" href="#kako">Kako radi</a>
      <a class="k-nav" href="ZaStolare.html">Za stolare</a>
      <a class="k-nav" href="ZaStolare.html#cene">Cene</a>
      <a class="k-nav" href="Radionice.html">Radionice</a>
    </nav>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 10px">
      <a class="k-nav" href="MojeKuhinje.html" aria-current="page" style="background: #E2EFE6; color: #1D4632">Moje kuhinje</a>
      <span aria-label="Miloš Jovanović" style="width: 38px; height: 38px; border-radius: 50%; background: #2E6B4E; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 700">MJ</span>
    </div>
  </div>
</header>

<main style="max-width: 1240px; margin: 0 auto; padding: 32px 24px 56px; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
    <div><h1 style="margin: 0; font-size: 36px">Moje kuhinje</h1><p style="margin: 6px 0 0; font-size: 16px; color: #3D3A35">Zdravo, Miloše. Nastavi rad na kuhinji ili napravi novu.</p></div>
    <a href="KupacStart.html" style="margin-left: auto; min-height: 48px; display: inline-flex; align-items: center; padding: 0 20px; border-radius: 8px; background: #2E6B4E; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">+ Nova kuhinja</a>
  </div>

  <sc-if value="{{showConsent}}" hint-placeholder-val="{{ true }}">
    <section role="region" aria-labelledby="cs-h" style="background: #FFFFFF; border: 2px solid #C49A6C; border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; align-items: center">
      <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 12px; background: #6B4A33; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px">RH</span>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h2 id="cs-h" style="margin: 0; font-size: 17px">Radionica Hrast bi da objavi tvoju kuhinju u svom portfoliju</h2>
        <span style="font-size: 14px; color: #3D3A35; line-height: 1.45">Objavljuju se samo osnova, 3D i materijali — bez tvog imena, adrese i fotografija. Možeš da povučeš saglasnost bilo kad.</span>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" class="k-btn" onClick="{{deny}}" style="min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid #BDB5A6; background: #FFFFFF; color: #1C1B19; font: 600 14px 'IBM Plex Sans', sans-serif; cursor: pointer">Ne, hvala</button>
        <button type="button" class="k-btn" onClick="{{allow}}" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 0; background: #2E6B4E; color: #FFFFFF; font: 600 14px 'IBM Plex Sans', sans-serif; cursor: pointer">Dozvoli objavu</button>
      </div>
    </section>
  </sc-if>
  <sc-if value="{{consentDone}}" hint-placeholder-val="{{ false }}"><div role="status" style="background: #E4F1E6; color: #1F5A2A; border-radius: 10px; padding: 12px 16px; font-size: 15px">{{consentMsg}}</div></sc-if>

  <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 18px">
    <sc-for list="{{kitchens}}" as="k" hint-placeholder-count="3">
      <li style="background: #FFFFFF; border: 1px solid #E4DFD5; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column">
        <span aria-hidden="true" style="{{k.img}}"></span>
        <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1">
          <div style="display: flex; align-items: center; gap: 8px"><h2 style="margin: 0; font-size: 18px">{{k.t}}</h2><span style="{{k.visStyle}}">{{k.vis}}</span></div>
          <span style="font-size: 14px; color: #5F5A52">{{k.m}}</span>
          <div style="{{k.stateStyle}}"><span aria-hidden="true" style="{{k.stateDot}}"></span><span style="flex: 1">{{k.state}}</span><sc-if value="{{k.hasAv}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 50%; background: #6B4A33; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font: 700 10px 'IBM Plex Sans', sans-serif">PS</span></sc-if></div>
          <sc-if value="{{k.hasNews}}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 10px; background: #E2EFE6; color: #1D4632">{{k.news}}</span></sc-if>
          <div style="margin-top: auto; display: flex; gap: 8px">
            <a href="{{k.href}}" style="flex: 1; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; background: #2E6B4E; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 14.5px">{{k.cta}}</a>
            <sc-if value="{{k.hasSec}}" hint-placeholder-val="{{ true }}"><a href="{{k.secHref}}" style="min-height: 44px; padding: 0 12px; display: inline-flex; align-items: center; border-radius: 8px; border: 1px solid #BDB5A6; color: #1C1B19; text-decoration: none; font-weight: 600; font-size: 14px">{{k.sec}}</a></sc-if>
            <button type="button" class="k-btn" aria-label="{{k.moreLabel}}" style="width: 44px; min-height: 44px; border-radius: 8px; border: 1px solid #BDB5A6; background: #FFFFFF; cursor: pointer; font: 700 18px 'IBM Plex Sans', sans-serif; color: #1C1B19">⋯</button>
          </div>
        </div>
      </li>
    </sc-for>
  </ul>
</main>
<footer style="border-top: 1px solid #E4DFD5; background: #F3F1EC">
  <div style="max-width: 1240px; margin: 0 auto; padding: 32px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; font-size: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px"><strong>Kroj</strong><span style="color: #5F5A52">Kuhinje po meri, od crteža do stolara.</span></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><strong>Za kuću</strong><a href="KupacStart.html">Napravi kuhinju</a><a href="Inspiracija.html">Inspiracija</a><a href="Radionice.html">Radionice</a></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><strong>Za stolare</strong><a href="ZaStolare.html">Kako radi</a><a href="ZaStolare.html#cene">Cene</a><a href="Prijava.html">Prijava</a></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><strong>Kroj</strong><a href="#">Uslovi</a><a href="#">Privatnost</a><a href="#">Kontakt</a></div>
  </div>
</footer>
</div>
</script>
<script type="text/x-dc-logic" id="dc-logic">
var K = [
  { t: 'Ugaona 320 × 240', m: 'Plus do 18. 2. · poslato 2 radionice', vis: 'Privatno', st: 'live', state: 'Uživo sa Radionica Hrast', news: '2 nove poruke · ponuda v2 stigla', cta: 'Otvori kuhinju', href: 'SesijaKupac.dc.html', sec: 'Saradnja', secHref: 'Saradnja.dc.html', c: ['#FFFFFF', '#C49A6C', '#FFFFFF'] },
  { t: 'Varijanta B — tamna', m: 'kopija prve, izmenjen izgled', vis: 'Javno', st: 'wait', state: 'Poslato — čeka radionicu (1 dan)', news: '', cta: 'Otvori kuhinju', href: 'SesijaKupac.dc.html', sec: '', secHref: '', c: ['#2A3A31', '#C49A6C', '#2A3A31'] },
  { t: 'Kuhinja za vikendicu', m: 'započeto 2. 11.', vis: 'Javno', st: 'draft', state: 'Nije poslato · korak Prostor', news: '', cta: 'Nastavi', href: 'SesijaKupac.dc.html', sec: '', secHref: '', c: ['#F3F1EC', '#DDD8CE', '#F3F1EC'] }
];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { consent: null }; }
  renderVals() {
    var self = this, s = this.state;
    return {
      showConsent: s.consent === null, consentDone: s.consent !== null,
      consentMsg: s.consent === 'yes' ? 'Hvala — Radionica Hrast može da objavi kuhinju u portfoliju. Saglasnost povlačiš u meniju kuhinje.' : 'U redu — kuhinja neće biti objavljena u portfoliju radionice.',
      allow: function () { self.setState({ consent: 'yes' }); }, deny: function () { self.setState({ consent: 'no' }); },
      kitchens: K.map(function (k) { var live = k.st === 'live'; return { t: k.t, m: k.m, vis: k.vis, state: k.state, news: k.news, hasNews: !!k.news, cta: k.cta, href: k.href, sec: k.sec, secHref: k.secHref, hasSec: !!k.sec, hasAv: live, moreLabel: 'Još opcija: ' + k.t,
        stateStyle: 'display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; padding: 8px 10px; border-radius: 8px; ' + (live ? 'background: #F2F8F4; color: #1D4632' : k.st === 'wait' ? 'background: #F6EEE2; color: #3A2A1F' : 'background: #F3F1EC; color: #3D3A35'),
        stateDot: 'width: 9px; height: 9px; border-radius: 50%; flex: none; background: ' + (live ? '#3FB06A; box-shadow: 0 0 0 3px rgba(63,176,106,0.25)' : k.st === 'wait' ? '#C49A6C' : '#BDB5A6'),
        visStyle: 'margin-left: auto; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px; ' + (k.vis === 'Javno' ? 'background: #E2EFE6; color: #1D4632' : 'background: #EADBC4; color: #3A2A1F'),
        img: 'display: block; height: 160px; background: linear-gradient(180deg, ' + k.c[0] + ' 0 40%, ' + k.c[1] + ' 40% 46%, ' + k.c[2] + ' 46% 100%); border-bottom: 1px solid #E4DFD5' }; })
    };
  }
}
</script>
<script>window.DC_PROPS = {};</script>
<script src="dc-lite.js"></script>
</body>
</html>
