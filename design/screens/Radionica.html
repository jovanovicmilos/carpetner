            <span style="font-size: 13.5px; color: #5F5A52; margin-top: -6px">{{k.m}}</span>

          <dt style="color: #5F5A52">Montaža</dt><dd style="margin: 0">da</dd>
          <dt style="color: #5F5A52">Rok izrade</dt><dd style="margin: 0">4–6 nedelja od merenja</dd>

          <dt style="color: #5F5A52">Ploče</dt><dd style="margin: 0">[PARTNER], Egger</dd>
