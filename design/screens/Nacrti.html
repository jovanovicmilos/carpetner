<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tehnički nacrti — spreda, odozgo, radne ploče</title>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F1EC;overflow:hidden}
.k-body{flex-direction:row}
@media (max-width: 900px){
.k-body{flex-direction:column}
.k-props{flex:0 0 auto !important;max-height:38vh;border-left:0 !important;border-top:1px solid #DDD8CE}
}
a{color:#2E6B4E}a:hover{color:#1D4632}
.k-tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;min-width:18px;margin-left:6px;padding:0;border-radius:50%;border:1px solid #8A8378;background:#FFFFFF;color:#5F5A52;font:600 11px 'IBM Plex Sans',sans-serif;cursor:help;vertical-align:middle;flex:none;text-transform:none;letter-spacing:0}
.k-tip:hover,.k-tip:focus-visible{background:#1F2B24;color:#FFFFFF;border-color:#1C1B19;outline:none}
.k-tip .k-pop{display:none;position:absolute;z-index:60;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:240px;background:#1F2B24;color:#F3F1EC;font:400 12.5px/1.45 'IBM Plex Sans',sans-serif;text-align:left;padding:8px 10px;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,0.18);white-space:normal;pointer-events:none}
.k-tip:hover .k-pop,.k-tip:focus .k-pop{display:block}
.k-tip.k-up .k-pop{top:auto;bottom:calc(100% + 8px)}
.k-tip.k-l .k-pop{left:auto;right:-6px;transform:none}
.k-tip.k-r .k-pop{left:-6px;transform:none}
.k-helpoff .k-tip{display:none}

.k-step{position:relative;display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border-radius:16px;font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap;color:#F3F1EC}
.k-step:hover{background:#2A3A31}
.k-step[aria-current="step"],.k-step[aria-current="step"]:hover{background:#F3F1EC;color:#1C1B19}
.k-step:focus-visible{outline:2px solid #8CC5A2;outline-offset:2px}
.k-steppop{display:none;position:absolute;z-index:80;top:calc(100% + 10px);left:50%;transform:translateX(-50%);width:230px;background:#FFFFFF;color:#1C1B19;border:1px solid #DDD8CE;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.22);padding:10px 12px;font:400 12.5px/1.45 'IBM Plex Sans',sans-serif;white-space:normal;text-align:left;pointer-events:none}
.k-step:hover .k-steppop,.k-step:focus-visible .k-steppop{display:block}
.k-stepline{width:14px;height:2px;flex:none;border-radius:1px}
@media (max-width: 900px){
.k-hdr{grid-template-columns:minmax(0,1fr) auto !important}
.k-hdr nav{grid-column:1 / -1;grid-row:2;justify-content:flex-start !important}
}
</style>
</helmet>
<div class="{{helpClass}}" style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B19; background: #F3F1EC; height: 100vh; min-height: 560px; overflow: hidden; display: flex; flex-direction: column">

<header class="k-hdr" style="position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px 16px; padding: 10px 20px; background: #1F2B24; color: #F3F1EC">
  <div style="display: flex; align-items: center; gap: 16px; min-width: 0">
  <a href="Projekti.html" aria-label="Kroj — svi projekti" style="display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; flex: none">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="3" width="22" height="22" rx="3" fill="none" stroke="#F3F1EC" stroke-width="2"></rect><path d="M3 11h22M11 11v14" stroke="#8CC5A2" stroke-width="2"></path></svg>
    <span style="font-weight: 700; font-size: 18px; letter-spacing: 0.02em">Kroj</span>
  </a>
    <div style="display: flex; flex-direction: column; min-width: 0; line-height: 1.3">
      <span style="font-size: 14px; color: #D8D3C9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Projekat: <strong style="color: #FFFFFF; font-weight: 600">Kuhinja Petrović — ugaona (L)</strong></span>
      <span style="font-size: 12px; color: #BDB6AA; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"><strong style="color: #8CC5A2; font-weight: 600">59 % urađeno</strong> · sledeće: potvrdi 4 elementa</span>
    </div>
  </div>
  <nav aria-label="Koraci projekta" style="display: flex; align-items: center; justify-content: center; gap: 2px">
    <a href="Main.html" class="k-step" aria-label="Korak 1 od 6: Prostor — završeno"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #8CC5A2; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#1C1B19" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span>Prostor</span><span class="k-steppop" aria-hidden="true"><span style="display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px"><strong>1 · Prostor</strong><span style="color: #1F5A2A">završeno</span></span><span style="display: flex; gap: 6px; align-items: baseline"><span aria-hidden="true" style="color: #2F7A3E; font-weight: 700; width: 10px">✓</span><span>Zidovi zatvoreni (4)</span></span><span style="display: flex; gap: 6px; align-items: baseline"><span aria-hidden="true" style="color: #2F7A3E; font-weight: 700; width: 10px">✓</span><span>Elementi postavljeni (13)</span></span><span style="display: flex; gap: 6px; align-items: baseline"><span aria-hidden="true" style="color: #2F7A3E; font-weight: 700; width: 10px">✓</span><span>Instalacije unete (11)</span></span><span style="display: flex; gap: 6px; align-items: baseline"><span aria-hidden="true" style="color: #2F7A3E; font-weight: 700; width: 10px">✓</span><span>Bez upozorenja</span></span><span style="display: block; margin-top: 6px; padding-top: 6px; border-top: 1px solid #EEEAE2; color: #5F5A52">Udeo u projektu: 25 %</span></span></a>
    <span class="k-stepline" aria-hidden="true" style="background: #8CC5A2"></span>
    <a href="Nacrti.html" class="k-step" aria-current="step" aria-label="Korak 2 od 6: Nacrti — završeno"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #8CC5A2; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#1C1B19" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span>Nacrti</span><span class="k-steppop" aria-hidden="true"><span style="display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px"><strong>2 · Nacrti</strong><span style="color: #1F5A2A">završeno</span></span><span style="display: flex; gap: 6px; align-items: baseline"><span aria-hidden="true" style="color: #2F7A3E; font-weight: 700; width: 10px">✓</span><span>Pregledani spreda i odozgo</span></span><span style="display: flex; gap: 6px; align-items: baseline"><span aria-hidden="true" style="color: #2F7A3E; font-weight: 700; width: 10px">✓</span><span>Strane otvaranja proverene</span></span><span style="display: block; margin-top: 6px; padding-top: 6px; border-top: 1px solid #EEEAE2; color: #5F5A52">Udeo u projektu: 10 %</span></span></a>
    <span class="k-stepline" aria-hidden="true" style="background: #8CC5A2"></span>
    <a href="Pogled3D.html" class="k-step" aria-label="Korak 3 od 6: 3D — završeno"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #8CC5A2; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#1C1B19" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span>3D</span><span class="k-steppop" aria-hidden="true"><span style="display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px"><strong>3 · 3D</strong><span style="color: #1F5A2A">završeno</span></span><span style="display: flex; gap: 6px; align-items: baseline"><span aria-hidden="true" style="color: #2F7A3E; font-weight: 700; width: 10px">✓</span><span>Fronte i radna ploča izabrane</span></span><span style="display: flex; gap: 6px; align-items: baseline"><span aria-hidden="true" style="color: #2F7A3E; font-weight: 700; width: 10px">✓</span><span>Ručke izabrane</span></span><span style="display: block; margin-top: 6px; padding-top: 6px; border-top: 1px solid #EEEAE2; color: #5F5A52">Udeo u projektu: 10 %</span></span></a>
    <span class="k-stepline" aria-hidden="true" style="background: #8CC5A2"></span>
    <a href="Element.html" class="k-step" aria-label="Korak 4 od 6: Elementi — u toku · 69 %"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(#8CC5A2 0 69%, #5A6E62 69% 100%); display: inline-flex; align-items: center; justify-content: center; flex: none"><span style="width: 16px; height: 16px; border-radius: 50%; background: #1F2B24; color: #F3F1EC; font: 600 11px 'IBM Plex Mono', monospace; display: inline-flex; align-items: center; justify-content: center">4</span></span><span>Elementi</span><span class="k-steppop" aria-hidden="true"><span style="display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px"><strong>4 · Elementi</strong><span style="color: #1D4632">u toku · 69 %</span></span><span style="display: flex; gap: 6px; align-items: baseline"><span aria-hidden="true" style="color: #2F7A3E; font-weight: 700; width: 10px">✓</span><span>Potvrđeno 9 od 13 elemenata</span></span><span style="display: flex; gap: 6px; align-items: baseline"><span aria-hidden="true" style="color: #8A8378; font-weight: 700; width: 10px">○</span><span>Čekaju potvrdu: D5, G3, G4, V1</span></span><span style="display: block; margin-top: 6px; padding-top: 6px; border-top: 1px solid #EEEAE2; color: #5F5A52">Udeo u projektu: 20 %</span></span></a>
    <span class="k-stepline" aria-hidden="true" style="background: #3E5045"></span>
    <a href="KrojnaLista.html" class="k-step" aria-label="Korak 5 od 6: Krojna lista — nije započeto"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #8A8378; color: #BDB6AA; font: 600 11px 'IBM Plex Mono', monospace; display: inline-flex; align-items: center; justify-content: center; flex: none">5</span><span>Krojna lista</span><span class="k-steppop" aria-hidden="true"><span style="display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px"><strong>5 · Krojna lista</strong><span style="color: #5F5A52">nije započeto</span></span><span style="display: flex; gap: 6px; align-items: baseline"><span aria-hidden="true" style="color: #8A8378; font-weight: 700; width: 10px">○</span><span>Krojna lista proverena</span></span><span style="display: flex; gap: 6px; align-items: baseline"><span aria-hidden="true" style="color: #8A8378; font-weight: 700; width: 10px">○</span><span>Poslata pilani</span></span><span style="display: block; margin-top: 6px; padding-top: 6px; border-top: 1px solid #EEEAE2; color: #5F5A52">Udeo u projektu: 20 %</span></span></a>
    <span class="k-stepline" aria-hidden="true" style="background: #3E5045"></span>
    <a href="Obracun.html" class="k-step" aria-label="Korak 6 od 6: Ponuda — nije započeto"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #8A8378; color: #BDB6AA; font: 600 11px 'IBM Plex Mono', monospace; display: inline-flex; align-items: center; justify-content: center; flex: none">6</span><span>Ponuda</span><span class="k-steppop" aria-hidden="true"><span style="display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px"><strong>6 · Ponuda</strong><span style="color: #5F5A52">nije započeto</span></span><span style="display: flex; gap: 6px; align-items: baseline"><span aria-hidden="true" style="color: #8A8378; font-weight: 700; width: 10px">○</span><span>Cene obračunate</span></span><span style="display: flex; gap: 6px; align-items: baseline"><span aria-hidden="true" style="color: #8A8378; font-weight: 700; width: 10px">○</span><span>Ponuda poslata kupcu</span></span><span style="display: block; margin-top: 6px; padding-top: 6px; border-top: 1px solid #EEEAE2; color: #5F5A52">Udeo u projektu: 15 %</span></span></a>
  </nav>
  <div style="justify-self: end; display: flex; align-items: center; gap: 12px">
    <div role="group" aria-label="Jedinice mere (važi za ceo projekat)" style="display: flex; border: 1px solid #5F5A52; border-radius: 6px; overflow: hidden">
      <button type="button" aria-pressed="{{mmPressed}}" onClick="{{setMm}}" style="{{mmStyle}}">mm</button>
      <button type="button" aria-pressed="{{cmPressed}}" onClick="{{setCm}}" style="{{cmStyle}}">cm</button>
    </div>
    <button type="button" aria-pressed="{{helpPressed}}" onClick="{{toggleHelp}}" style="{{helpStyle}}" title="Uključi ili isključi objašnjenja (oznake i) na svim ekranima"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M8 7v4.5M8 4.6v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>Pomoć</button>
  </div>
  <div role="progressbar" aria-label="Projekat urađen" aria-valuemin="0" aria-valuemax="100" aria-valuenow="59" style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #34463B"><div style="width: 59%; height: 100%; background: #8CC5A2"></div></div>
</header>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; background: #FFFFFF; border-bottom: 1px solid #DDD8CE">
  <div role="tablist" aria-label="Nacrt" style="display: flex; gap: 4px; padding: 3px; background: #F3F1EC; border-radius: 8px">
    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
      <button type="button" role="tab" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}" style="{{tb.style}}">{{tb.label}}</button>
    </sc-for>
  </div>
  <div role="group" aria-label="Stil nacrta" style="display: flex; gap: 4px; padding: 3px; background: #F3F1EC; border-radius: 8px">
    <sc-for list="{{styles}}" as="sy" hint-placeholder-count="3">
      <button type="button" aria-pressed="{{sy.sel}}" onClick="{{sy.pick}}" style="{{sy.style}}">{{sy.label}}</button>
    </sc-for>
  </div><button type="button" class="k-tip" aria-label="Prezentacija: u boji, za kupca. Tehnički: crno-belo sa sastavnicom, za radionicu i montažu. Kombinovano: boje i sastavnica zajedno."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Prezentacija: u boji, za kupca. Tehnički: crno-belo sa sastavnicom, za radionicu i montažu. Kombinovano: boje i sastavnica zajedno.</span></button>
  <span style="width: 1px; height: 28px; background: #DDD8CE"></span>
  <label style="display: flex; align-items: center; gap: 6px; min-height: 40px; font-size: 13px"><input type="checkbox" checked="{{showNum}}" onChange="{{tNum}}" style="width: 16px; height: 16px; accent-color: #2E6B4E">Brojevi</label><button type="button" class="k-tip" aria-label="Oznake elemenata (D1, G1, V1…), iste u krojnoj listi i na nalepnicama."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Oznake elemenata (D1, G1, V1…), iste u krojnoj listi i na nalepnicama.</span></button>
  <label style="display: flex; align-items: center; gap: 6px; min-height: 40px; font-size: 13px"><input type="checkbox" checked="{{showDim}}" onChange="{{tDim}}" style="width: 16px; height: 16px; accent-color: #2E6B4E">Kote</label><button type="button" class="k-tip" aria-label="Lanci mera: pojedinačni elementi i ukupno; desno visine od poda."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Lanci mera: pojedinačni elementi i ukupno; desno visine od poda.</span></button>
  <label style="display: flex; align-items: center; gap: 6px; min-height: 40px; font-size: 13px"><input type="checkbox" checked="{{showOpen}}" onChange="{{tOpen}}" style="width: 16px; height: 16px; accent-color: #2E6B4E">Smer otvaranja</label><button type="button" class="k-tip" aria-label="Spreda: isprekidane linije se sastaju na strani šarki. Odozgo: linija otvorenog krila počinje od šarki."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Spreda: isprekidane linije se sastaju na strani šarki. Odozgo: linija otvorenog krila počinje od šarki.</span></button>
  <label style="display: flex; align-items: center; gap: 6px; min-height: 40px; font-size: 13px"><input type="checkbox" checked="{{showInst}}" onChange="{{tInst}}" style="width: 16px; height: 16px; accent-color: #2E6B4E">Instalacije</label><button type="button" class="k-tip" aria-label="Voda, odvod i struja sa visinom od poda i oznaka izreza u leđima."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Voda, odvod i struja sa visinom od poda i oznaka izreza u leđima.</span></button>
  <div style="margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px">
    <button type="button" style="font: inherit; font-size: 13px; padding: 8px 12px; min-height: 40px; border-radius: 6px; border: 1px solid #DDD8CE; background: #FFFFFF; color: #1C1B19">Štampaj</button>
    <button type="button" onClick="{{exportAllPdf}}" style="font: inherit; font-size: 13px; font-weight: 600; padding: 8px 12px; min-height: 40px; border-radius: 6px; border: 0; background: #2E6B4E; color: #FFFFFF">PDF A3 — svi nacrti</button>
  </div>
</div>

<div class="k-body" style="display: flex; flex: 1; min-height: 0">
  <main style="flex: 1 1 auto; min-width: 0; min-height: 0; overflow: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px">

      <h1 style="margin: 0; font-size: 20px">{{viewTitle}}</h1>
      <span style="font-size: 13px; color: #5F5A52">{{viewSub}}</span>

        <a href="Zid.html" style="margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 6px; background: #1F2B24; color: #FFFFFF; text-decoration: none; font-size: 13px; font-weight: 600">Uredi instalacije ovog zida<span aria-hidden="true">→</span></a>
      </sc-if>
    </div>
    <div style="background: #FFFFFF; border: {{frameBorder}}; border-radius: {{frameRadius}}; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; filter: {{drawFilter}}">

      <sc-if value="{{isFront}}" hint-placeholder-val="{{ true }}">

          <defs>
            <pattern id="hatchF" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8A8378" stroke-width="1"></line></pattern>
          </defs>
          <text x="440" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#1C1B19">Zid A · pogled spreda</text>
          <rect x="120" y="80" width="640" height="520" fill="none" stroke="#1C1B19" stroke-width="1.2"></rect>

          <rect x="340" y="160" width="200" height="240" fill="#F4F7FC" stroke="#1C1B19" stroke-width="1.2"></rect>
          <rect x="348" y="168" width="88" height="224" fill="none" stroke="#1C1B19" stroke-width="0.8"></rect>
          <rect x="444" y="168" width="88" height="224" fill="none" stroke="#1C1B19" stroke-width="0.8"></rect>
          <line x1="436" y1="280" x2="444" y2="280" stroke="#1C1B19" stroke-width="2"></line>

          <rect x="120" y="580" width="640" height="20" fill="#EADBC4" stroke="#1C1B19" stroke-width="0.8"></rect>
          <rect x="120" y="428.4" width="640" height="7.6" fill="#C9B79A" stroke="#1C1B19" stroke-width="0.8"></rect>

          <rect x="120" y="436" width="80" height="144" fill="url(#hatchF)" stroke="#1C1B19" stroke-width="0.8"></rect>
          <rect x="200.6" y="436.6" width="118.8" height="142.8" fill="#FFFFFF" stroke="#1C1B19" stroke-width="1.2"></rect>
          <rect x="320.6" y="436.6" width="78.8" height="142.8" fill="#FFFFFF" stroke="#1C1B19" stroke-width="1.2"></rect>
          <rect x="400.6" y="436.6" width="78.8" height="142.8" fill="#FFFFFF" stroke="#1C1B19" stroke-width="1.2"></rect>
          <rect x="480.6" y="436.6" width="118.8" height="142.8" fill="#FFFFFF" stroke="#1C1B19" stroke-width="1.2"></rect>
