<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI predlog iz fotografije</title>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F1EC;overflow:hidden}
.k-body{flex-direction:row}
@media (max-width: 900px){
.k-body{flex-direction:column}
.k-props{flex:0 0 auto !important;max-height:42vh;border-left:0 !important;border-right:0 !important;border-top:1px solid #DDD8CE}
}
a{color:#B4440E}a:hover{color:#7C2D0A}
.k-tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;min-width:18px;margin-left:6px;padding:0;border-radius:50%;border:1px solid #8A8378;background:#FFFFFF;color:#5F5A52;font:600 11px 'IBM Plex Sans',sans-serif;cursor:help;vertical-align:middle;flex:none;text-transform:none;letter-spacing:0}
.k-tip:hover,.k-tip:focus-visible{background:#1C1B19;color:#FFFFFF;border-color:#1C1B19;outline:none}
.k-tip .k-pop{display:none;position:absolute;z-index:60;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:240px;background:#1C1B19;color:#F3F1EC;font:400 12.5px/1.45 'IBM Plex Sans',sans-serif;text-align:left;padding:8px 10px;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,0.18);white-space:normal;pointer-events:none}
.k-tip:hover .k-pop,.k-tip:focus .k-pop{display:block}
.k-tip.k-up .k-pop{top:auto;bottom:calc(100% + 8px)}
.k-tip.k-l .k-pop{left:auto;right:-6px;transform:none}
.k-tip.k-r .k-pop{left:-6px;transform:none}
.k-helpoff .k-tip{display:none}

</style>
</helmet>
<div class="{{helpClass}}" style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B19; background: #F3F1EC; height: 100vh; min-height: 560px; overflow: hidden; display: flex; flex-direction: column">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 10px 20px; background: #1C1B19; color: #F3F1EC">
  <div style="display: flex; align-items: center; gap: 10px">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="3" width="22" height="22" rx="3" fill="none" stroke="#F3F1EC" stroke-width="2"></rect><path d="M3 11h22M11 11v14" stroke="#E2804D" stroke-width="2"></path></svg>
    <span style="font-weight: 700; font-size: 18px; letter-spacing: 0.02em">Kroj</span>
  </div>
  <div style="font-size: 14px; color: #D8D3C9">Projekat: <strong style="color: #FFFFFF; font-weight: 600">Kuhinja Petrović — ugaona (L)</strong></div>
  <nav aria-label="Koraci projekta" style="display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto">
    <a href="AIPredlog.html" style="padding: 8px 14px; border-radius: 6px; background: #E2804D; color: #1C1B19; text-decoration: none; font-size: 14px; font-weight: 600">0 AI iz slike</a>
    <a href="Main.html" style="padding: 8px 14px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">1 Prostor</a>
    <a href="Zid.html" style="padding: 8px 14px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">2 Zidovi</a>
    <a href="Pogled3D.html" style="padding: 8px 14px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">3 3D</a>
    <a href="KrojnaLista.html" style="padding: 8px 14px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">5 Krojna lista</a>
  </nav>
  <button type="button" aria-pressed="{{helpPressed}}" onClick="{{toggleHelp}}" style="{{helpStyle}}" title="Uključi ili isključi objašnjenja (oznake i) na svim ekranima"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M8 7v4.5M8 4.6v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>Pomoć</button>
</header>

<div class="k-body" style="display: flex; flex: 1; min-height: 0">
  <main style="flex: 1 1 auto; min-width: 0; min-height: 0; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px">
      <h1 style="margin: 0; font-size: 22px">AI predlog iz fotografije<button type="button" class="k-tip k-r" aria-label="AI sa slike prepoznaje zidove, otvore i instalacije i predlaže mere. Ništa ne ulazi u projekat dok ne klikneš Prihvati."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">AI sa slike prepoznaje zidove, otvore i instalacije i predlaže mere. Ništa ne ulazi u projekat dok ne klikneš Prihvati.</span></button></h1>
      <span style="font-size: 14px; color: #5F5A52">AI predlaže — ti potvrđuješ. Ništa ne ulazi u projekat bez tvog „Prihvati".</span>
    </div>

    <div style="position: relative; background: #DCD6CB; border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; min-height: 300px">
      <svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mesto za fotografiju prostora sa prepoznatim zidovima, prozorom i instalacijama" style="position: absolute; inset: 0; width: 100%; height: 100%; font-family: 'IBM Plex Mono', monospace">
        <rect x="0" y="0" width="800" height="450" fill="#D2CBBE"></rect>
        <polygon points="0,0 260,70 260,390 0,450" fill="#C4BCAD"></polygon>
        <polygon points="260,70 800,40 800,450 260,390" fill="#DCD6CB"></polygon>
        <polygon points="0,450 260,390 800,450" fill="#B3A995"></polygon>
        <text x="400" y="230" text-anchor="middle" font-size="15" fill="#5F5A52">[FOTOGRAFIJA PROSTORA]</text>
        <line x1="260" y1="70" x2="260" y2="390" stroke="#B4440E" stroke-width="3"></line>
        <line x1="260" y1="390" x2="800" y2="450" stroke="#B4440E" stroke-width="3" stroke-dasharray="10 6"></line>
        <line x1="0" y1="450" x2="260" y2="390" stroke="#B4440E" stroke-width="3" stroke-dasharray="10 6"></line>
        <rect x="380" y="110" width="180" height="150" fill="none" stroke="#1E50C8" stroke-width="3"></rect>
        <rect x="380" y="92" width="72" height="18" fill="#1E50C8"></rect>
        <text x="386" y="106" font-size="12" fill="#FFFFFF">prozor</text>
        <circle cx="470" cy="330" r="12" fill="#1E50C8" stroke="#FFFFFF" stroke-width="2"></circle>
        <text x="470" y="334" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">V</text>
        <circle cx="500" cy="340" r="12" fill="#57534E" stroke="#FFFFFF" stroke-width="2"></circle>
        <text x="500" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">O</text>
        <circle cx="660" cy="250" r="12" fill="#F2B630" stroke="#1C1B19" stroke-width="1.5"></circle>
        <text x="660" y="254" text-anchor="middle" font-size="11" font-weight="700" fill="#1C1B19">S</text>
        <circle cx="120" cy="300" r="12" fill="#F2B630" stroke="#1C1B19" stroke-width="1.5"></circle>
        <text x="120" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="#1C1B19">S</text>
        <rect x="560" y="410" width="150" height="24" rx="4" fill="#1C1B19"></rect>
        <text x="635" y="427" text-anchor="middle" font-size="12" fill="#FFFFFF">zid A ≈ 3200 mm</text>
      </svg>
      <div style="position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap">
        <button type="button" style="font: inherit; font-size: 13px; padding: 8px 12px; min-height: 40px; border-radius: 6px; border: 0; background: #FFFFFF; color: #1C1B19">Zameni fotografiju</button>
        <button type="button" style="font: inherit; font-size: 13px; padding: 8px 12px; min-height: 40px; border-radius: 6px; border: 0; background: #FFFFFF; color: #1C1B19">+ Još jedna (drugi zid)</button>
      </div>
    </div>

    <section aria-label="Predefinisani zadaci" style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 15px">Šta AI da uradi<button type="button" class="k-tip k-r" aria-label="Gotovi zadaci, bez pisanja uputstva. Radionica ih uključuje i isključuje u Admin → AI asistent."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Gotovi zadaci, bez pisanja uputstva. Radionica ih uključuje i isključuje u Admin → AI asistent.</span></button></h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{prompts}}" as="p" hint-placeholder-count="6">
          <button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
        </sc-for>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 8px; padding: 12px 14px; font-size: 14px; line-height: 1.5; color: #3D3A35">{{promptText}}</div>
    </section>
  </main>

  <aside aria-label="Predlog za proveru" class="k-props" style="flex: 0 0 420px; min-height: 0; overflow-y: auto; background: #FFFFFF; border-left: 1px solid #DDD8CE; padding: 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px">
      <h2 style="margin: 0; font-size: 18px">Predlog za proveru<button type="button" class="k-tip k-l" aria-label="Svaka stavka ima sigurnost: visoka je unapred prihvaćena, srednja i niska čekaju tvoju proveru. Izmeni ispravlja meru pre prenosa."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Svaka stavka ima sigurnost: visoka je unapred prihvaćena, srednja i niska čekaju tvoju proveru. Izmeni ispravlja meru pre prenosa.</span></button></h2>
      <span style="font-size: 13px; color: #5F5A52">{{acceptedCount}} / {{total}} prihvaćeno</span>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5F5A52; background: #FBE3D3; border-radius: 8px; padding: 12px">
      <span style="color: #7C2D0A; font-weight: 600; font-size: 14px">Jedna mera metrom je obavezna</span>
      <span style="color: #7C2D0A">Sa slike se mere samo procenjuju. Unesi jednu izmerenu meru — ostale se preračunaju.</span>
      <span style="display: flex; align-items: center; gap: 8px; color: #1C1B19">Zid A (mm)<input type="text" value="3200" style="width: 110px; font-family: 'IBM Plex Mono', monospace; font-size: 15px; padding: 8px 10px; border: 1px solid #B4440E; border-radius: 6px; background: #FFFFFF"></span>
    </label>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="7">
        <div style="{{it.rowStyle}}">
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 14px; font-weight: 600">{{it.title}}</div>
            <div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #3D3A35">{{it.value}}</div>
            <div style="font-size: 12px; color: {{it.confColor}}">sigurnost: {{it.conf}}</div>
          </div>
          <button type="button" aria-label="Izmeni: {{it.title}}" style="font: inherit; font-size: 13px; padding: 6px 10px; min-height: 40px; border-radius: 6px; border: 1px solid #DDD8CE; background: #FFFFFF; color: #1C1B19">Izmeni</button>
          <button type="button" aria-pressed="{{it.pressed}}" onClick="{{it.toggle}}" style="{{it.btnStyle}}">{{it.btnLabel}}</button>
        </div>
      </sc-for>
    </div>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
      <a href="Main.html" style="display: inline-flex; justify-content: center; align-items: center; min-height: 48px; border-radius: 6px; background: #B4440E; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">Prenesi prihvaćeno u projekat</a>
      <a href="Main.html" style="display: inline-flex; justify-content: center; align-items: center; min-height: 44px; border-radius: 6px; border: 1px solid #DDD8CE; color: #1C1B19; text-decoration: none; font-size: 15px">Preskoči AI — crtam ručno</a>
      <p style="margin: 0; font-size: 12px; color: #5F5A52; line-height: 1.5">Svaka AI izmena se upisuje u istoriju projekta i može da se poništi.</p>
    </div>
  </aside>
</div>
</div>
</script>
<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { acc: { w1: true, w2: true, win: true, v: true, o: true }, prompt: 'detect' }; }
  renderVals0() {
    const PR = [
      ['detect', 'Prepoznaj zidove i instalacije', 'Sa fotografija prepoznaj zidove, ugao, otvore i instalacije (voda, odvod, struja, gas). Mere izračunaj iz jedne izmerene mere. Za svaku stavku navedi sigurnost i ništa ne upisuj u projekat bez potvrde.'],
      ['layout', 'Predloži raspored kuhinje', 'Na osnovu prostora i instalacija predloži raspored elemenata: sudopera iznad vode i odvoda, rerna i ploča uz trofaznu utičnicu, frižider na kraju niza. Koristi podrazumevane mere radionice.'],
      ['photo-kitchen', 'Prepiši postojeću kuhinju sa slike', 'Sa slike gotove kuhinje prepoznaj elemente (donji, gornji, visoki), broj vrata i fioka, i napravi ih kao elemente sa procenjenim širinama.'],
      ['check', 'Proveri projekat', 'Pronađi greške: instalacije iza pogrešnog elementa, mere van standarda, preklapanja, fronte bez okova, delove veće od ploče.'],
      ['cutlist', 'Objasni krojnu listu', 'Objasni krojnu listu ovog projekta i predloži uštedu ploča i kanta.'],
      ['quote', 'Napiši ponudu kupcu', 'Napiši kratak, jasan tekst ponude za kupca na osnovu obračuna, bez internih cena.']
    ];
    const on = 'font: inherit; font-size: 13px; padding: 8px 12px; min-height: 40px; border-radius: 999px; border: 1px solid #1C1B19; background: #1C1B19; color: #FFFFFF';
    const off = 'font: inherit; font-size: 13px; padding: 8px 12px; min-height: 40px; border-radius: 999px; border: 1px solid #DDD8CE; background: #FFFFFF; color: #1C1B19';
    const prompts = PR.map((p) => ({ label: p[1], pressed: this.state.prompt === p[0] ? 'true' : 'false', style: this.state.prompt === p[0] ? on : off, pick: () => this.setState({ prompt: p[0] }) }));
    const promptText = (PR.find((p) => p[0] === this.state.prompt) || PR[0])[2];
    const IT = [
      ['w1', 'Zid A', '3200 mm (izmereno)', 'visoka', '#1F5A2A'],
      ['w2', 'Zid B, ugao 90°', '≈ 2400 mm', 'srednja', '#7C2D0A'],
      ['win', 'Prozor na zidu A', 'od ugla ≈ 1100, š ≈ 1000, parapet ≈ 1000', 'srednja', '#7C2D0A'],
      ['v', 'Voda T+H', 'zid A, od ugla ≈ 1500, h ≈ 500', 'visoka', '#1F5A2A'],
      ['o', 'Odvod Ø50', 'zid A, od ugla ≈ 1650, h ≈ 450', 'visoka', '#1F5A2A'],
      ['s1', 'Utičnica', 'zid A, od ugla ≈ 2700, h ≈ 1100', 'srednja', '#7C2D0A'],
      ['s2', 'Utičnica', 'zid B, od ugla ≈ 900, h ≈ 600', 'niska — proveri', '#7C2D0A']
    ];
    const acc = this.state.acc;
    const items = IT.map((i) => {
      const a = !!acc[i[0]];
      return {
        title: i[1], value: i[2], conf: i[3], confColor: i[4],
        pressed: a ? 'true' : 'false', btnLabel: a ? 'Prihvaćeno' : 'Prihvati',
        btnStyle: a ? 'font: inherit; font-size: 13px; padding: 6px 10px; min-height: 40px; min-width: 104px; border-radius: 6px; border: 1px solid #1F5A2A; background: #E4F1E6; color: #1F5A2A; font-weight: 600' : 'font: inherit; font-size: 13px; padding: 6px 10px; min-height: 40px; min-width: 104px; border-radius: 6px; border: 1px solid #1C1B19; background: #1C1B19; color: #FFFFFF',
        rowStyle: 'display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; border: 1px solid ' + (a ? '#B9D9BF' : '#DDD8CE'),
        toggle: () => this.setState({ acc: Object.assign({}, acc, { [i[0]]: !a }) })
      };
    });
    return { prompts, promptText, items, total: IT.length, acceptedCount: IT.filter((i) => acc[i[0]]).length };
  }
  helpOn() {
    if (this._help === undefined) { var h = null; try { h = window.localStorage.getItem('kroj.help'); } catch (x) {} this._help = h !== 'off'; }
    return this._help;
  }
  renderVals() {
    var self = this, on = this.helpOn();
    var base = 'font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; min-height: 36px; border-radius: 6px; cursor: pointer; ';
    return Object.assign(this.renderVals0(), {
      helpClass: on ? 'k-helpon' : 'k-helpoff', hasHelp: on, helpPressed: on ? 'true' : 'false',
      helpStyle: base + (on ? 'border: 1px solid #E2804D; background: #E2804D; color: #1C1B19; font-weight: 600' : 'border: 1px solid #5F5A52; background: transparent; color: #F3F1EC'),
      toggleHelp: function () { self._help = !self.helpOn(); try { window.localStorage.setItem('kroj.help', self._help ? 'on' : 'off'); } catch (x) {} if (self.forceUpdate) self.forceUpdate(); else self.setState({}); }
    });
  }
}
</script>
<script>window.DC_PROPS = {};</script>
<script src="dc-lite.js"></script>
</body>
</html>
