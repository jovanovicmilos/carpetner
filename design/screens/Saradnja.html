<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saradnja — kuhinja, poruke i ponuda</title>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F1EC}
a{color:#2E6B4E}a:hover{color:#1D4632}
.k-top{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:6px;font-size:14px;font-weight:500;color:#F3F1EC;text-decoration:none;white-space:nowrap}
.k-top:hover{background:#2A3A31;color:#FFFFFF}
.k-top[aria-current="page"],.k-top[aria-current="page"]:hover{background:#F3F1EC;color:#1C1B19}
.k-top:focus-visible,.k-btn:focus-visible{outline:2px solid #2E6B4E;outline-offset:2px}
textarea:focus-visible{outline:2px solid #2E6B4E;outline-offset:1px}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B19; background: #F3F1EC; height: 920px; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; align-items: center; gap: 14px; height: 52px; box-sizing: border-box; padding: 0 16px; background: #1F2B24; color: #F3F1EC; flex: none">
  <a href="Projekti.html" aria-label="Kroj — projekti" style="display: flex; align-items: center; gap: 9px; color: inherit; text-decoration: none">
    <svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="3" width="22" height="22" rx="3" fill="none" stroke="#F3F1EC" stroke-width="2"></rect><path d="M3 11h22M11 11v14" stroke="#8CC5A2" stroke-width="2"></path></svg>
    <span style="font-weight: 700; font-size: 17px">Kroj</span>
  </a>
  <nav aria-label="Glavni meni" style="display: flex; align-items: center; gap: 2px; margin-left: 6px">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="3"><a href="{{n.href}}" class="k-top" aria-current="{{n.cur}}">{{n.t}}</a></sc-for>
  </nav>
  <div style="margin-left: auto; display: flex; align-items: center; gap: 8px">
    <sc-if value="{{isShop}}" hint-placeholder-val="{{ true }}"><a href="AdminShell.html" style="min-height: 36px; padding: 0 12px; border-radius: 6px; display: inline-flex; align-items: center; gap: 7px; font: 600 14px 'IBM Plex Sans', sans-serif; color: #F3F1EC; border: 1px solid #3E5045; text-decoration: none">Radionica <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg></a></sc-if>
    <span title="{{me.name}}" style="{{me.av}}">{{me.i}}</span>
  </div>
</header>

<div style="display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: #FFFFFF; border-bottom: 1px solid #DDD8CE; flex: none">
  <a href="{{backHref}}" style="font-size: 14px; min-height: 32px; display: inline-flex; align-items: center">{{backText}}</a>
  <div style="display: flex; flex-direction: column; line-height: 1.25">
    <h1 style="margin: 0; font-size: 19px">{{title}}</h1>
    <span style="font-size: 13px; color: #5F5A52">{{subtitle}}</span>
  </div>
  <ol aria-label="Tok posla" style="list-style: none; margin: 0 0 0 auto; padding: 0; display: flex; align-items: center; gap: 4px">
    <sc-for list="{{stages}}" as="s" hint-placeholder-count="6">
      <sc-if value="{{s.line}}" hint-placeholder-val="{{ false }}"><li aria-hidden="true" style="{{s.lineStyle}}"></li></sc-if>
      <li style="{{s.textStyle}}" aria-current="{{s.cur}}"><span aria-hidden="true" style="{{s.dot}}"></span>{{s.t}}</li>
    </sc-for>
  </ol>
  <span style="display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 12px 0 8px; border-radius: 17px; border: 1px solid #DDD8CE; font: 600 13px 'IBM Plex Sans', sans-serif"><span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 50%; background: #3FB06A; box-shadow: 0 0 0 3px rgba(63,176,106,0.25)"></span><span aria-hidden="true" style="{{other.av}}">{{other.i}}</span>{{presence}}</span>
</div>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px">
  <main style="min-width: 0; overflow-y: auto; padding: 18px 20px; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-content: start">
    <section aria-labelledby="k-h" style="grid-column: 1 / -1; background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 12px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); overflow: hidden">
      <div style="position: relative; background-color: #FAF8F4; background-image: linear-gradient(#E4DFD5 1px, transparent 1px), linear-gradient(90deg, #E4DFD5 1px, transparent 1px); background-size: 28px 28px; min-height: 290px; border-right: 1px solid #EEEAE2">
        <svg viewBox="0 0 420 270" role="img" aria-label="Kuhinja uživo: ugaona 320 × 240, 7 elemenata" style="position: absolute; left: 10px; top: 10px; width: calc(100% - 20px); height: calc(100% - 20px)">
          <path d="M30 255V30H400" fill="none" stroke="#1C1B19" stroke-width="7"></path>
          <rect x="140" y="26" width="90" height="8" fill="#DCE7F7" stroke="#1C1B19" stroke-width="1"></rect>
          <rect x="34" y="34" width="95" height="58" fill="#EADBC4" stroke="#1C1B19" stroke-width="1"></rect>
          <rect x="129" y="34" width="76" height="58" fill="#C9DAF2" stroke="#6B4A33" stroke-width="2.5"></rect>
          <rect x="205" y="34" width="57" height="58" fill="#FFFFFF" stroke="#1C1B19" stroke-width="1"></rect>
          <rect x="262" y="34" width="48" height="58" fill="#EADBC4" stroke="#2E6B4E" stroke-width="2.5"></rect>
          <rect x="34" y="92" width="58" height="57" fill="#3A3936" stroke="#1C1B19" stroke-width="1"></rect>
          <rect x="34" y="149" width="58" height="57" fill="#EADBC4" stroke="#1C1B19" stroke-width="1"></rect>
          <rect x="34" y="206" width="58" height="47" fill="#D6BE98" stroke="#1C1B19" stroke-width="1"></rect>
        </svg>
        <span style="position: absolute; left: 12px; top: 12px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 10px; background: #FFFFFF; border: 1px solid #DDD8CE"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #3FB06A"></span>uživo</span>
      </div>
      <div style="padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
        <div><h2 id="k-h" style="margin: 0; font-size: 18px">Kuhinja</h2><span style="font-size: 13.5px; color: #5F5A52">Jedna kuhinja — menjate je oboje, u Prostoru.</span></div>
        <dl style="margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; font-size: 14px">
          <dt style="color: #5F5A52">Elementi</dt><dd style="margin: 0">7 donjih i visokih · 4 gornja</dd>
          <dt style="color: #5F5A52">Izgled</dt><dd style="margin: 0">Svetla · šipka · hrast 38</dd>
          <dt style="color: #5F5A52">Poslednja izmena</dt><dd style="margin: 0">{{lastEdit}}</dd>
        </dl>
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #3D3A35">
          <sc-for list="{{edits}}" as="e" hint-placeholder-count="3"><li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="{{e.dot}}"></span><strong style="font-weight: 600">{{e.who}}</strong><span>{{e.t}}</span><span style="margin-left: auto; color: #8A8378">{{e.when}}</span></li></sc-for>
        </ul>
        <div style="margin-top: auto; display: flex; gap: 8px">
          <a href="{{openHref}}" style="flex: 1; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; background: #2E6B4E; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">Otvori kuhinju</a>
          <a href="Pogled3D.html" style="min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 8px; border: 1px solid #BDB5A6; color: #1C1B19; text-decoration: none; font-weight: 600; font-size: 14px">3D</a>
        </div>
      </div>
    </section>

    <section aria-labelledby="o-h" style="background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px"><h2 id="o-h" style="margin: 0; font-size: 18px">Ponuda</h2><span style="{{offer.badgeStyle}}">{{offer.badge}}</span></div>
      <div style="display: flex; align-items: baseline; gap: 10px"><span style="font: 700 26px 'IBM Plex Mono', monospace">268.066 RSD</span><span style="font-size: 13px; color: #5F5A52">v2 · važi do 5. 12.</span></div>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; color: #3D3A35">
        <li style="display: flex; gap: 8px"><span>v2 · 22. 11.</span><span style="color: #5F5A52">posle merenja, sudopera pomerena</span><span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace">+4.200</span></li>
        <li style="display: flex; gap: 8px; color: #8A8378"><span>v1 · 19. 11.</span><span>bez merenja</span><span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace">263.866</span></li>
      </ul>
      <div style="margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{offer.actions}}" as="a" hint-placeholder-count="2"><a href="{{a.href}}" style="{{a.style}}">{{a.t}}</a></sc-for>
      </div>
    </section>

    <section aria-labelledby="m-h" style="background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
      <h2 id="m-h" style="margin: 0; font-size: 18px">Termini i dokumenti</h2>
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #F2F8F4; border: 1px solid #A9D6BA"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="3.5" width="14" height="12" rx="2" fill="none" stroke="#1D4632" stroke-width="1.5"></rect><path d="M2 7.5h14M6 2v3M12 2v3" stroke="#1D4632" stroke-width="1.5"></path></svg><span style="font-size: 14px; flex: 1"><strong>Merenje</strong> · 22. 11. u 17:00 · urađeno</span></div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; border: 1px dashed #BDB5A6; font-size: 14px; color: #5F5A52"><span style="flex: 1"><strong style="color: #1C1B19">Montaža</strong> · dogovara se posle prihvaćene ponude</span><button type="button" class="k-btn" style="border: 0; background: transparent; color: #2E6B4E; font: 600 13px 'IBM Plex Sans', sans-serif; cursor: pointer; min-height: 30px">{{termAction}}</button></div>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 14px">
        <li><a href="Obracun.html" style="min-height: 30px; display: inline-flex; align-items: center">Ponuda v2 (PDF)</a></li>
        <li><a href="Nacrti.html" style="min-height: 30px; display: inline-flex; align-items: center">Nacrt kuhinje (PDF)</a></li>
        <li><span style="min-height: 30px; display: inline-flex; align-items: center; color: #5F5A52">2 fotografije prostorije</span></li>
      </ul>
    </section>
  </main>

  <aside aria-label="Poruke" style="background: #FFFFFF; border-left: 1px solid #DDD8CE; display: flex; flex-direction: column; min-height: 0">
    <div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #EEEAE2">
      <h2 style="margin: 0; font-size: 16px">Poruke</h2>
      <span role="radiogroup" aria-label="Prikaži" style="margin-left: auto; display: inline-flex; background: #F3F1EC; border-radius: 6px; padding: 2px">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{f.on}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.text}}</button></sc-for>
      </span>
    </div>
    <ol aria-label="Poruke i izmene" style="list-style: none; margin: 0; padding: 12px 16px; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{feed}}" as="f" hint-placeholder-count="6">
        <sc-if value="{{f.isDay}}" hint-placeholder-val="{{ false }}"><li style="align-self: center; font-size: 12px; color: #5F5A52">{{f.text}}</li></sc-if>
        <sc-if value="{{f.isEvent}}" hint-placeholder-val="{{ false }}"><li style="align-self: center; font-size: 12.5px; color: #3D3A35; background: #F6EEE2; border-radius: 12px; padding: 4px 10px">{{f.text}}</li></sc-if>
        <sc-if value="{{f.isEdit}}" hint-placeholder-val="{{ false }}"><li style="display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #3D3A35"><span aria-hidden="true" style="{{f.dot}}"></span><strong style="font-weight: 600">{{f.who}}</strong><span>{{f.text}}</span><span style="margin-left: auto; color: #8A8378">{{f.when}}</span></li></sc-if>
        <sc-if value="{{f.isMsg}}" hint-placeholder-val="{{ true }}"><li style="{{f.wrap}}"><span style="font-size: 11.5px; color: #5F5A52">{{f.who}} · {{f.when}}</span><span style="{{f.bubble}}">{{f.text}}</span><sc-if value="{{f.hasPin}}" hint-placeholder-val="{{ false }}"><a href="{{openHref}}" style="font-size: 11.5px">Komentar na: {{f.pin}}</a></sc-if></li></sc-if>
      </sc-for>
    </ol>
    <form style="border-top: 1px solid #EEEAE2; padding: 10px 16px 12px; display: flex; gap: 6px; align-items: flex-end">
      <textarea rows="2" aria-label="{{composeAria}}" placeholder="Napiši poruku…" style="flex: 1; min-width: 0; font: 400 14px/1.4 'IBM Plex Sans', sans-serif; padding: 8px 10px; border: 1px solid #BDB5A6; border-radius: 8px; resize: none"></textarea>
      <button type="button" class="k-btn" style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: #2E6B4E; color: #FFFFFF; font: 600 13.5px 'IBM Plex Sans', sans-serif; cursor: pointer">Pošalji</button>
    </form>
  </aside>
</div>
</div>
</script>
<script type="text/x-dc-logic" id="dc-logic">
// Saradnja without proposals (design/BRIEF_ZAJEDNICKA_SESIJA.md): one place for the kitchen (live), the offer and the messages.
// Middle: the shared kitchen + recent edits + "Otvori kuhinju"; the offer with versions and the action for each role;
// dates and documents. Right: the same feed as in Prostor (messages by default, edits with "Sve").
var CUST = { i: 'MJ', name: 'Miloš Jovanović', c: '#2E6B4E' }, SHOP = { i: 'PS', name: 'Petar Stanić (Radionica Hrast)', c: '#6B4A33' };
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { filter: 'msg' }; }
  renderVals() {
    var self = this, s = this.state, shop = (this.props.role || 'stolar') === 'stolar';
    var me = shop ? SHOP : CUST, other = shop ? CUST : SHOP;
    var av = function (p, size) { return 'width: ' + size + 'px; height: ' + size + 'px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 700 ' + (size > 26 ? 12.5 : 10.5) + 'px \'IBM Plex Sans\', sans-serif; color: #FFFFFF; background: ' + p.c + (size > 26 ? '; border: 2px solid #3E5045' : ''); };
    var ST = ['Poslato', 'Preuzeto', 'Merenje', 'Ponuda', 'Prihvaćeno', 'Montaža'], cur = 3;
    var FEED = [
      { k: 'day', text: '22. 11.' }, { k: 'event', text: 'Ponuda v2 poslata · 268.066 RSD' },
      { k: 'msg', side: 'shop', when: '18:40', text: 'Poslao sam novu ponudu posle merenja. Razlika je zbog fioka 2 × 30.' },
      { k: 'day', text: 'Danas' },
      { k: 'msg', side: 'cust', when: '11:52', text: 'Može li sudopera ispod prozora?' },
      { k: 'msg', side: 'shop', when: '11:58', text: 'Može, pomeram je — odvod je na 145 cm.' },
      { k: 'edit', side: 'shop', when: '12:05', text: 'pomerio Sudoperu (D2)' },
      { k: 'edit', side: 'cust', when: '12:06', text: 'promenio Fioke (D4) 60 → 50' },
      { k: 'msg', side: 'cust', when: '12:07', text: 'Da li 50 cm fioke staju za šerpe?', pin: 'D4 Fioke' }
    ];
    return {
      isShop: shop, me: { i: me.i, name: me.name, av: av(me, 32) }, other: { i: other.i, av: av(other, 22) },
      nav: (shop ? [['Projekti', 'Projekti', false], ['Kuhinja — Miloš Jovanović', 'SesijaStolar', false], ['Upiti', 'Upiti', true]] : [['Moje kuhinje', 'MojeKuhinje', true], ['Inspiracija', 'Inspiracija', false]]).map(function (n) { return { t: n[0], href: n[1] + '.dc.html', cur: n[2] ? 'page' : 'false' }; }),
      backHref: shop ? 'Upiti.dc.html' : 'KupacPonude.dc.html', backText: shop ? '← Upiti' : '← Ponude',
      title: shop ? 'Ugaona 320 × 240 — Miloš Jovanović' : 'Ugaona 320 × 240 — Radionica Hrast',
      subtitle: shop ? 'Novi Sad, Liman · upit od 18. 11.' : 'Petar Stanić · Novi Sad',
      presence: shop ? 'Miloš je u kuhinji' : 'Petar je u kuhinji',
      stages: ST.map(function (t, i) { var done = i < cur, on = i === cur; return { t: t, line: i > 0, cur: on ? 'step' : 'false',
        lineStyle: 'width: 14px; height: 2px; background: ' + (i <= cur ? '#8CC5A2' : '#DDD8CE'),
        textStyle: 'display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; ' + (on ? 'font-weight: 600; color: #1C1B19' : done ? 'color: #3D3A35' : 'color: #8A8378'),
        dot: 'width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; ' + (done ? 'background: #8CC5A2' : on ? 'border: 2.5px solid #2E6B4E; background: #FFFFFF' : 'border: 1.5px solid #BDB5A6') }; }),
      lastEdit: (shop ? 'Miloš' : 'Ti') + ' · danas u 12:06',
      edits: [['cust', 'promenio Fioke (D4) 60 → 50', '12:06'], ['shop', 'pomerio Sudoperu (D2)', '12:05'], ['shop', 'dodao završnu lajsnu', 'juče']].map(function (e) { var mine = (e[0] === 'shop') === shop; return { who: mine ? 'Ti' : (e[0] === 'shop' ? 'Petar' : 'Miloš'), t: e[1], when: e[2], dot: 'width: 8px; height: 8px; border-radius: 2px; flex: none; background: ' + (e[0] === 'shop' ? SHOP.c : CUST.c) }; }),
      openHref: shop ? 'SesijaStolar.dc.html' : 'SesijaKupac.dc.html',
      offer: { badge: 'čeka odgovor kupca', badgeStyle: 'font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #EADBC4; color: #3A2A1F',
        actions: shop ? [{ t: 'Nova verzija ponude', href: 'Obracun.dc.html', style: 'min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 8px; border: 1px solid #2E6B4E; color: #1D4632; text-decoration: none; font-weight: 600; font-size: 14px' }, { t: 'PDF', href: 'Obracun.dc.html', style: 'min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 8px; border: 1px solid #BDB5A6; color: #1C1B19; text-decoration: none; font-weight: 600; font-size: 14px' }]
          : [{ t: 'Prihvati ponudu', href: 'KupacPonude.dc.html', style: 'flex: 1; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; background: #2E6B4E; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px' }, { t: 'Pogledaj PDF', href: 'Obracun.dc.html', style: 'min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 8px; border: 1px solid #BDB5A6; color: #1C1B19; text-decoration: none; font-weight: 600; font-size: 14px' }] },
      termAction: shop ? 'Predloži termin' : 'Predloži termin',
      filters: [['msg', 'Poruke'], ['all', 'Sve']].map(function (f) { var on = s.filter === f[0]; return { text: f[1], on: on ? 'true' : 'false', pick: function () { self.setState({ filter: f[0] }); }, style: 'min-height: 28px; padding: 0 10px; border: 0; border-radius: 5px; font: 500 12.5px \'IBM Plex Sans\', sans-serif; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #1C1B19; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.12)' : 'background: transparent; color: #3D3A35') }; }),
      feed: FEED.filter(function (f) { return s.filter === 'all' || f.k !== 'edit'; }).map(function (f) { var mine = (f.side === 'shop') === shop, who = mine ? 'Ti' : (f.side === 'shop' ? 'Petar' : 'Miloš');
        return { isDay: f.k === 'day', isEvent: f.k === 'event', isEdit: f.k === 'edit', isMsg: f.k === 'msg', text: f.text, when: f.when || '', who: who, hasPin: !!f.pin, pin: f.pin || '',
          dot: 'width: 8px; height: 8px; border-radius: 2px; flex: none; background: ' + (f.side === 'shop' ? SHOP.c : CUST.c),
          wrap: 'display: flex; flex-direction: column; gap: 3px; max-width: 86%; ' + (mine ? 'align-self: flex-end; align-items: flex-end' : 'align-self: flex-start'),
          bubble: 'font-size: 14px; line-height: 1.4; padding: 8px 11px; border-radius: 10px; ' + (mine ? 'background: #E2EFE6' : 'background: #F3F1EC') }; }),
      composeAria: 'Poruka za ' + other.name
    };
  }
}
</script>
<script>window.DC_PROPS = {"role": "stolar"};</script>
<script src="dc-lite.js"></script>
</body>
</html>
