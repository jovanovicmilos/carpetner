<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kroj — upišeš zid, dobiješ kuhinju</title>

<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F4}
a{color:#2E6B4E}a:hover{color:#1D4632}
*{box-sizing:border-box}
.s-page{font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1C1B19;background-color:#FAF8F4;background-image:linear-gradient(rgba(46,107,78,0.055) 1px,transparent 1px),linear-gradient(90deg,rgba(46,107,78,0.055) 1px,transparent 1px);background-size:24px 24px;position:relative}
.s-ruler{position:absolute;left:28px;top:0;bottom:0;width:14px;border-right:1px solid #C9C1B2;background-image:repeating-linear-gradient(180deg,#C9C1B2 0 1px,transparent 1px 12px),repeating-linear-gradient(180deg,#8A8378 0 1px,transparent 1px 120px);background-size:7px 100%,14px 100%;background-repeat:repeat-y;background-position:right top,right top;pointer-events:none}
.k-nav{color:#1C1B19;text-decoration:none;font-size:14.5px;font-weight:500;padding:8px 10px;border-radius:6px;white-space:nowrap}
.k-nav:hover{background:#EEEAE2;color:#1C1B19}
.k-step{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;color:#3D3A35;text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap}
.k-step:hover{background:#EEEAE2;color:#1C1B19}
.k-step[aria-current="true"]{background:#1F2B24;color:#FFFFFF}
.k-step .n{font:600 11px 'IBM Plex Mono',monospace;color:#8A8378}
.k-step[aria-current="true"] .n{color:#8CC5A2}
.b-pri{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;background:#2E6B4E;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:14.5px;white-space:nowrap;border:0;cursor:pointer}
.b-pri:hover{background:#1D4632;color:#FFFFFF}
.b-pri.lg{height:56px;padding:0 28px;font-size:17px;border-radius:10px}
.b-out{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 24px;border-radius:10px;border:1px solid #BDB5A6;background:#FFFFFF;color:#1C1B19;text-decoration:none;font-weight:600;font-size:17px}
.b-out:hover{background:#F3F1EC;color:#1C1B19}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #2E6B4E;outline-offset:2px}
.s-sec{position:relative;padding:72px 0 56px;scroll-margin-top:72px}
.s-wrap{max-width:1280px;margin:0 auto;padding:0 40px 0 72px}
.s-head{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.s-num{font:600 15px 'IBM Plex Mono',monospace;color:#FFFFFF;background:#1F2B24;border-radius:6px;padding:4px 8px}
.s-kick{font:600 14px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#2E6B4E}
.s-rule{flex:1;height:11px;border-left:1px solid #8A8378;border-right:1px solid #8A8378;background:linear-gradient(#8A8378,#8A8378) center/100% 1px no-repeat}
.s-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:start}
.s-left{display:flex;flex-direction:column;gap:18px;position:sticky;top:96px}
.s-h2{margin:0;font-size:54px;line-height:1.02;letter-spacing:-0.025em;font-weight:700}
.s-lead{margin:0;font-size:20px;line-height:1.5;color:#3D3A35}
.s-cta{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 20px;border-radius:10px;background:#2E6B4E;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:16px}
.s-cta:hover{background:#1D4632;color:#FFFFFF}
.s-notes-h{margin-top:10px;font:600 12.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#5F5A52;border-top:1px dashed #BDB5A6;padding-top:16px}
.s-notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.s-notes li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45}
.s-notes strong{display:block;font-weight:600;font-size:15.5px}
.s-nd{color:#5F5A52}
.s-call{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #2E6B4E;color:#1D4632;display:inline-flex;align-items:center;justify-content:center;font:600 12.5px 'IBM Plex Mono',monospace;background:#FFFFFF}
.s-sheet{background:#FFFFFF;border:1.5px solid #1C1B19;border-radius:4px;box-shadow:8px 8px 0 rgba(31,43,36,0.08);display:flex;flex-direction:column}
.s-sheet-top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #1C1B19}
.s-try{font:700 12px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#FFFFFF;background:#2E6B4E;padding:3px 8px;border-radius:4px}
.s-try-t{font-size:15px;font-weight:600}
.s-ctrls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 20px;padding:14px 14px 12px;border-bottom:1px dashed #BDB5A6;background:#FCFBF8}
.s-lbl{display:flex;flex-direction:column;gap:6px;font:500 13px 'IBM Plex Sans',sans-serif;color:#3D3A35}
.s-seg{align-self:flex-start;display:inline-flex;height:38px;padding:3px;border-radius:8px;background:#F3F1EC;gap:2px}
.s-segb{height:100%;padding:0 12px;border:0;border-radius:6px;background:transparent;color:#5F5A52;font:500 14px 'IBM Plex Sans',sans-serif;cursor:pointer;white-space:nowrap}
.s-segb:hover{color:#1C1B19}
.s-segb[aria-checked="true"]{background:#FFFFFF;color:#1C1B19;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.s-range{display:flex;align-items:center;gap:10px}
.s-range input{width:170px;accent-color:#2E6B4E}
.s-range output{font:600 15px 'IBM Plex Mono',monospace;min-width:64px}
.s-sw{display:flex;gap:6px}
.s-swb{width:34px;height:34px;border-radius:50%;border:2px solid #FFFFFF;box-shadow:0 0 0 1px #BDB5A6;cursor:pointer;padding:0}
.s-swb[aria-checked="true"]{box-shadow:0 0 0 2px #2E6B4E}
.s-draw{padding:12px 14px;min-height:420px;display:flex;align-items:center;justify-content:center}
.s-titleblock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1.5px solid #1C1B19}
.s-titleblock>div{padding:9px 12px;border-left:1px solid #1C1B19;display:flex;flex-direction:column;gap:2px}
.s-titleblock>div:first-child{border-left:0}
.s-tb-l{font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#8A8378}
.s-tb-v{font:600 15px 'IBM Plex Mono',monospace;color:#1C1B19}
.s-table{width:100%;border-collapse:collapse;font-size:13.5px}
.s-table th{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#5F5A52;text-align:left;padding:6px 8px;border-bottom:1.5px solid #1C1B19}
.s-table td{padding:6px 8px;border-bottom:1px solid #EEEAE2}
.s-table .m{font-family:'IBM Plex Mono',monospace}
.s-table .r{text-align:right}
.s-draw svg text{font-family:"IBM Plex Mono",ui-monospace,monospace}</style>
</helmet>
<div class="s-page">
<div class="s-ruler" aria-hidden="true"></div>

<header style="position: sticky; top: 0; z-index: 10; background: rgba(250,248,244,0.96); border-bottom: 1.5px solid #1C1B19; backdrop-filter: blur(6px)">
  <div style="max-width: 1440px; margin: 0 auto; padding: 10px 28px; display: flex; align-items: center; gap: 18px">
    <a href="#" aria-label="Kroj — na vrh" style="display: flex; align-items: center; gap: 9px; color: #1C1B19; text-decoration: none; flex: none">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="3" width="22" height="22" rx="3" fill="#1F2B24"></rect><path d="M3 11h22M11 11v14" stroke="#8CC5A2" stroke-width="2"></path></svg>
      <span style="font-weight: 700; font-size: 19px">Kroj</span>
    </a>
    <nav aria-label="Koraci na stranici" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 0">
      <sc-for list="{{toc}}" as="s" hint-placeholder-count="6">
        <sc-if value="{{s.sep}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" style="flex: none; margin: 0 1px"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="#A59D90" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
        <a href="{{s.href}}" class="k-step" aria-current="{{s.cur}}" onClick="{{s.go}}"><span class="n">{{s.n}}</span>{{s.t}}</a>
      </sc-for>
    </nav>
    <div style="display: flex; align-items: center; gap: 4px; flex: none">
      <a class="k-nav" href="Inspiracija.html">Inspiracija</a>
      <a class="k-nav" href="ZaStolare.html">Za stolare</a>
      <a class="k-nav" href="Prijava.html">Prijava</a>
      <a href="KupacStart.html" class="b-pri" style="margin-left: 6px">Napravi kuhinju</a>
    </div>
  </div>
</header>
<section aria-labelledby="hero-h" style="padding: 64px 0 40px">
  <div class="s-wrap" style="display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 22px">
      <span style="font: 600 13px 'IBM Plex Mono', monospace; letter-spacing: 0.14em; color: #2E6B4E">KROJ · KUHINJA PO MERI</span>
      <h1 id="hero-h" style="margin: 0; font-size: 76px; line-height: 0.98; letter-spacing: -0.035em; font-weight: 700">Upišeš zid.<br>Dobiješ kuhinju.</h1>
      <p style="margin: 0; font-size: 21px; line-height: 1.5; color: #3D3A35">I to ne sliku — nego <strong>nacrte, 3D, svaki ormarić, listu za pilanu i cenu</strong>. Sve iz istog crteža. Promeniš jedan broj, menja se sve.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 12px"><a href="KupacStart.html" class="b-pri lg">Napravi svoju kuhinju</a><a href="#prostor" class="b-out">Kako? Skroluj ↓</a></div>
      <p style="margin: 0; font-size: 14.5px; color: #5F5A52">Besplatno · bez naloga dok ne sačuvaš · 10 minuta</p>
    </div>
    <div class="s-sheet">
      <div class="s-sheet-top"><span class="s-try" style="background: #1F2B24">List 0/6</span><span class="s-try-t">Ovo je napravljeno u Kroju. Skroluj i menjaj je.</span></div>
      <div class="s-draw" style="min-height: 380px; padding: 0"><img src="assets/site/web/3d-hero.webp" alt="Kuhinja Petrović, ugaona L 320 × 240, hrast — realni 3D prikaz iz Kroja" style="width: 100%; height: auto; max-height: 420px; object-fit: contain"></div>
      <div class="s-titleblock"><div><span class="s-tb-l">Oblik</span><span class="s-tb-v">{{tb.shape}}</span></div><div><span class="s-tb-l">Mere</span><span class="s-tb-v">{{tb.dims}}</span></div><div><span class="s-tb-l">Elementi</span><span class="s-tb-v">{{tb.units}}</span></div><div><span class="s-tb-l">Cena od</span><span class="s-tb-v">{{tb.price}}</span></div></div>
    </div>
  </div>
  <div class="s-wrap" style="margin-top: 48px">
    <ol aria-label="Šest koraka" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1.5px solid #1C1B19; border-radius: 4px; background: #FFFFFF">
      <sc-for list="{{toc}}" as="s" hint-placeholder-count="6">
        <li style="{{s.box}}"><a href="{{s.href}}" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 16px; color: #1C1B19; text-decoration: none; height: 100%"><span style="display: flex; align-items: center; justify-content: space-between"><span style="font: 600 12px 'IBM Plex Mono', monospace; color: #2E6B4E">{{s.n}}</span><span aria-hidden="true" style="color: #8A8378; font-size: 15px">↓</span></span><strong style="font-size: 19px; letter-spacing: -0.01em">{{s.t}}</strong><span style="font-size: 14px; line-height: 1.4; color: #5F5A52">{{s.d}}</span></a></li>
      </sc-for>
    </ol>
  </div>
</section>
<section id="prostor" aria-labelledby="prostor-h" class="s-sec">
  <div class="s-wrap">
    <div class="s-head">
      <span class="s-num" aria-hidden="true">01</span>
      <span class="s-kick">PROSTOR</span>
      <span class="s-rule" aria-hidden="true"></span>
    </div>
    <div class="s-grid">
      <div class="s-left">
        <h2 id="prostor-h" class="s-h2">Upiši dva broja. Ostalo je naše.</h2>
        <p class="s-lead">Izmeriš zidove metrom i upišeš dužine. Kroj sam složi ormariće po pravilima struke — sudopera ispod prozora, ploča dalje od ugla, frižider na kraju.</p>
        <a href="KupacStart.html" class="s-cta">Unesi svoje zidove<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
        <div class="s-notes-h">Šta Kroj radi ispod haube</div>
        <ol class="s-notes">
          <sc-for list="{{notesProstor}}" as="nt" hint-placeholder-count="4">
            <li><span class="s-call" aria-hidden="true">{{nt.n}}</span><span><strong>{{nt.t}}</strong><span class="s-nd">{{nt.d}}</span></span></li>
          </sc-for>
        </ol>
      </div>
      <div class="s-sheet">
        <div class="s-sheet-top"><span class="s-try">Probaj</span><span class="s-try-t">Izaberi oblik — raspored je Krojev, ne naš crtež</span></div>
        <div class="s-ctrls"><div class="s-lbl">Oblik<div role="radiogroup" aria-label="Oblik kuhinje" class="s-seg"><sc-for list="{{shapeOpts}}" as="o" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" class="s-segb">{{o.t}}</button></sc-for></div></div><div class="s-lbl">Prikaz<div role="radiogroup" aria-label="Prikaz" class="s-seg"><sc-for list="{{pvOpts}}" as="o" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" class="s-segb">{{o.t}}</button></sc-for></div></div></div>
        <div class="s-draw"><sc-if value="{{pv2d}}" hint-placeholder-val="{{ true }}"><div style="width: 100%"><sc-if value="{{plan.prava}}" hint-placeholder-val="{{ true }}"><svg viewBox="-450 -510 4100 900" role="img" aria-label="Tlocrt: 1 zidova, D1 donji 600, D2 sudopera 800, D3 MSP 600, D4 rerna 600, V1 visoki 600, G1 gornji 600, G2 gornji 400, G3 gornji 400" style="width: 1000px; font-family: &quot;IBM Plex Sans&quot;, system-ui, sans-serif; font-weight: 400; text-anchor: start; dominant-baseline: auto; width: 100%; height: auto; max-height: 460px" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid500" width="500" height="500" patternUnits="userSpaceOnUse"><path d="M500 0H0V500" fill="none" stroke="#E4DFD5" stroke-width="4.555555555555555"/></pattern><pattern id="hatch" width="39.90267639902677" height="39.90267639902677" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="39.90267639902677" height="39.90267639902677" fill="#EDE9E1"/><rect width="19.951338199513383" height="39.90267639902677" fill="#CFC8BB"/></pattern><pattern id="chimney" width="39.90267639902677" height="39.90267639902677" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><rect width="39.90267639902677" height="39.90267639902677" fill="#E4DED2"/><rect width="19.951338199513383" height="39.90267639902677" fill="#B8AFA0"/></pattern><pattern id="radiator" width="34.914841849148424" height="34.914841849148424" patternUnits="userSpaceOnUse"><rect width="34.914841849148424" height="34.914841849148424" fill="#D3D6D9"/><rect width="9.975669099756692" height="34.914841849148424" fill="#8A8F96"/></pattern><filter id="marker-shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="4.987834549878346" stdDeviation="7.481751824817518" flood-opacity="0.25"/></filter></defs><rect x="-200000" y="-200000" width="400000" height="400000" fill="#FAF8F4"/><rect x="-200000" y="-200000" width="400000" height="400000" fill="url(#grid500)"/><g><title>Zid A         <h2 id="prikaz-3d-h" class="s-h2">Okreni je. Pre nego što postoji.</h2>
        <p class="s-lead">Isti crtež, samo u prostoru. Biraš fronte i radnu ploču i odmah vidiš da li ti se sviđa — pre nego što je iko išta isekao.</p>
        <a href="KupacStart.html" class="s-cta">Obuci svoju kuhinju<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>

<section id="ponuda" aria-labelledby="ponuda-h" class="s-sec">
  <div class="s-wrap">
    <div class="s-head">
      <span class="s-num" aria-hidden="true">06</span>
      <span class="s-kick">PONUDA</span>
      <span class="s-rule" aria-hidden="true"></span>
    </div>
    <div class="s-grid">
      <div class="s-left">
        <h2 id="ponuda-h" class="s-h2">Cena. Bez pogađanja.</h2>
        <p class="s-lead">Materijal, kant, okov, radna ploča, rad i montaža — sve se sabere samo, iz istog crteža. Pošalješ stolarima i dobiješ prave ponude za tačno tvoju kuhinju.</p>
        <a href="KupacStart.html" class="s-cta">Pošalji stolarima<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
        <div class="s-notes-h">Šta Kroj radi ispod haube</div>
        <ol class="s-notes">
          <sc-for list="{{notesPo}}" as="nt" hint-placeholder-count="4">
            <li><span class="s-call" aria-hidden="true">{{nt.n}}</span><span><strong>{{nt.t}}</strong><span class="s-nd">{{nt.d}}</span></span></li>
          </sc-for>
        </ol>
      </div>
      <div class="s-sheet">
        <div class="s-sheet-top"><span class="s-try">Probaj</span><span class="s-try-t">Koliko košta ova kuhinja</span></div>
        <div class="s-ctrls"><div class="s-lbl">Ko pravi<div role="radiogroup" aria-label="Ko pravi" class="s-seg"><sc-for list="{{whoOpts}}" as="o" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" class="s-segb">{{o.t}}</button></sc-for></div></div></div>
