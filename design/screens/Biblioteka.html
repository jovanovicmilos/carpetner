<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · materijali, ručke i aparati</title>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F1EC}
a{color:#2E6B4E}a:hover{color:#1D4632}
.k-tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;min-width:18px;margin-left:6px;padding:0;border-radius:50%;border:1px solid #8A8378;background:#FFFFFF;color:#5F5A52;font:600 11px 'IBM Plex Sans',sans-serif;cursor:help;vertical-align:middle;flex:none;text-transform:none;letter-spacing:0}
.k-tip:hover,.k-tip:focus-visible{background:#1F2B24;color:#FFFFFF;border-color:#1C1B19;outline:none}
.k-tip .k-pop{display:none;position:absolute;z-index:60;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:240px;background:#1F2B24;color:#F3F1EC;font:400 12.5px/1.45 'IBM Plex Sans',sans-serif;text-align:left;padding:8px 10px;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,0.18);white-space:normal;pointer-events:none}
.k-tip:hover .k-pop,.k-tip:focus .k-pop{display:block}
.k-tip.k-up .k-pop{top:auto;bottom:calc(100% + 8px)}
.k-tip.k-l .k-pop{left:auto;right:-6px;transform:none}
.k-tip.k-r .k-pop{left:-6px;transform:none}
.k-helpoff .k-tip{display:none}

</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B19; background: #F3F1EC; min-height: 1300px; display: flex; flex-wrap: wrap">

  <nav aria-label="Administracija" style="flex: 1 1 240px; max-width: 100%; background: #1F2B24; color: #F3F1EC; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 18px">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M11.2 25.4c1.3-.5 2-1.8 2.1-3.8l.1-4.3h1.2l.1 4.3c.1 2 .8 3.3 2.1 3.8z" fill="#C49A6C"></path><path d="M13.9 18.4 10.6 16M14 18v-2.4M14.4 18.3l3.4-2.5" fill="none" stroke="#C49A6C" stroke-width="1.1" stroke-linecap="round"></path><path d="M9.6 25.4h8.8" stroke="#C49A6C" stroke-width="1.2" stroke-linecap="round"></path><path d="M3.6 15.2a2.6 2.6 0 0 1 .6-4.6a3 3 0 0 1 3.4-4.2a3.4 3.4 0 0 1 5-2.6a3.4 3.4 0 0 1 5.2.6a3 3 0 0 1 4 3.4a2.8 2.8 0 0 1 2.4 4a2.4 2.4 0 0 1-.4 4.2a2.6 2.6 0 0 1-4 .8a2.4 2.4 0 0 1-3.4.4a2.4 2.4 0 0 1-3.6 0a2.4 2.4 0 0 1-3.4-.4a2.6 2.6 0 0 1-4-.8a1.8 1.8 0 0 1-1.8-.8z" fill="#5E9B74"></path><path d="M3.9 12.9a2.6 2.6 0 0 1 .3-2.3a3 3 0 0 1 3.4-4.2a3.4 3.4 0 0 1 5-2.6a3.4 3.4 0 0 1 5.2.6a3 3 0 0 1 4 3.4a2.8 2.8 0 0 1 2.4 4a2.2 2.2 0 0 1-.3 1.4c-1-.7-2.3-.6-3.1.2c-.9-.8-2.4-.8-3.3 0c-1-.9-2.6-.9-3.6 0c-.9-.8-2.4-.8-3.3 0c-.8-.8-2.1-.9-3.1-.2c-.8-.4-1.4-.4-1.9-.2z" fill="#8CC5A2"></path><path d="M7.2 9.2a2.2 2.2 0 0 1 2.4-2.4a2.6 2.6 0 0 1 4.2-1.4a2.4 2.4 0 0 1 2.6.2c-1.6.2-2.6 1-3 2.2c-1.4-.6-3 0-3.6 1.4c-1-.4-2-.4-2.6 0z" fill="#B5DCC2"></path></svg>
      <span style="font-weight: 700; font-size: 18px">Kroj</span>
      <span style="font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #8CC5A2; color: #1C1B19; font-weight: 600">ADMIN</span>
    </div>
    <div style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #C9C3B8; padding: 8px 8px 4px">Radionica</div>
    <a href="Obracun.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">Projekti i ponude</a>
    <a href="Cenovnik.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">Cenovnik</a>
    <a href="Biblioteka.html" aria-current="page" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 6px; background: #F3F1EC; color: #1C1B19; text-decoration: none; font-size: 14px; font-weight: 600">Materijali, ručke, aparati</a>
    <a href="Standardi.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">Podrazumevane mere</a>
    <a href="Biblioteka.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">Katalog elemenata</a>
    <a href="Cenovnik.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">Dobavljači i pilane</a>
    <a href="Cenovnik.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">Zaposleni i uloge</a>
    <div style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #C9C3B8; padding: 16px 8px 4px">Platforma</div>
    <a href="Cenovnik.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">Pretplate i računi</a>
    <a href="Cenovnik.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">Radionice (korisnici)</a>
    <a href="Cenovnik.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">Globalni katalog okova</a>
  </nav>

  <main style="flex: 999 1 640px; min-width: 0; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
      <div>
        <h1 style="margin: 0; font-size: 28px; display: flex; align-items: center">Materijali, ručke i aparati<button type="button" class="k-tip k-r" aria-label="Sve što određuje izgled kuhinje u realnom 3D prikazu. Svaki materijal i ručka su vezani za artikal iz cenovnika, pa jedna izmena važi za cenu, krojnu listu, okov i 3D."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Sve što određuje izgled kuhinje u realnom 3D prikazu. Svaki materijal i ručka su vezani za artikal iz cenovnika, pa jedna izmena važi za cenu, krojnu listu, okov i 3D.</span></button></h1>
        <p style="margin: 4px 0 0; color: #5F5A52; font-size: 15px">Izgled u realnom prikazu · vezano za cenovnik radionice</p>
      </div>
      <div style="margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap">
        <a href="Pogled3D.html" style="display: inline-flex; align-items: center; font-size: 14px; padding: 0 14px; min-height: 44px; border-radius: 6px; border: 1px solid #DDD8CE; background: #FFFFFF; color: #1C1B19; text-decoration: none">Pogledaj u 3D</a>
        <button type="button" style="font: inherit; font-size: 14px; font-weight: 600; padding: 10px 14px; min-height: 44px; border-radius: 6px; border: 0; background: #2E6B4E; color: #FFFFFF">Sačuvaj izmene</button>
      </div>
    </div>

    <div role="tablist" aria-label="Biblioteka izgleda" style="display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid #DDD8CE">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4">
        <button type="button" role="tab" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}" style="{{tb.style}}">{{tb.text}}<span style="margin-left: 6px; font: 12px 'IBM Plex Mono', monospace; color: #8A8378">{{tb.count}}</span></button>
      </sc-for>
    </div>

    <sc-if value="{{tabMat}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
        <section aria-label="Materijali" style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 10px; padding: 8px 16px 16px">
          <div style="overflow-x: auto">
            <table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px">
              <thead><tr style="text-align: left; color: #5F5A52; font-size: 13px"><th style="padding: 12px 8px 12px 0; font-weight: 500">Materijal</th><th style="padding: 12px 8px; font-weight: 500">Vrsta</th><th style="padding: 12px 8px; font-weight: 500">Tekstura</th><th style="padding: 12px 8px; font-weight: 500">Površina</th><th style="padding: 12px 0 12px 8px; font-weight: 500">Izvor teksture</th></tr></thead>
              <tbody>
                <sc-for list="{{mats}}" as="m" hint-placeholder-count="8">
                  <tr style="{{m.rowStyle}}">
                    <td style="padding: 8px 8px 8px 0"><button type="button" onClick="{{m.pick}}" aria-pressed="{{m.sel}}" style="font: inherit; display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 0; cursor: pointer; text-align: left; color: #1C1B19"><span style="{{m.sw}}"></span><span><span style="display: block; font-weight: 600">{{m.name}}</span><span style="font: 12px 'IBM Plex Mono', monospace; color: #5F5A52">{{m.code}}</span></span></button></td>
                    <td style="padding: 8px; color: #3D3A35">{{m.kind}}</td>
                    <td style="padding: 8px; color: #3D3A35">{{m.tex}}</td>
                    <td style="padding: 8px; color: #3D3A35">{{m.finish}}</td>
                    <td style="padding: 8px 0 8px 8px"><span style="{{m.licStyle}}">{{m.lic}}</span></td>
                  </tr>
                </sc-for>
              </tbody>
            </table>
          </div>
          <button type="button" style="margin-top: 12px; font: inherit; font-size: 14px; min-height: 44px; padding: 0 14px; border-radius: 6px; border: 1px dashed #8A8378; background: #FFFFFF; color: #1C1B19">+ Dodaj materijal iz cenovnika</button>
        </section>
        <aside aria-label="Izabrani materijal" style="flex: 1 1 320px; background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
          <div style="{{selSw}}"></div>
          <div><div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #2E6B4E">Izgled u 3D</div><h2 style="margin: 2px 0 0; font-size: 20px">{{selName}}</h2><div style="font-size: 13px; color: #5F5A52">{{selPrice}}</div></div>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5F5A52">Fajl teksture<span style="display: flex; gap: 8px; align-items: center"><span style="flex: 1; font: 13px 'IBM Plex Mono', monospace; color: #1C1B19; padding: 9px 10px; border: 1px solid #DDD8CE; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{selFile}}</span><button type="button" style="font: inherit; font-size: 13px; min-height: 40px; padding: 0 12px; border-radius: 6px; border: 1px solid #1C1B19; background: #FFFFFF">Otpremi</button></span></label>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5F5A52"><span style="display: flex; align-items: center">Uzorak (mm)<button type="button" class="k-tip k-r" aria-label="Kolika je površina jedne slike teksture u stvarnosti. Bez ovoga šara u 3D ispadne prevelika ili premala."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Kolika je površina jedne slike teksture u stvarnosti. Bez ovoga šara u 3D ispadne prevelika ili premala.</span></button></span><input type="text" value="{{selRepeat}}" style="font: 14px 'IBM Plex Mono', monospace; padding: 9px 10px; border: 1px solid #DDD8CE; border-radius: 6px"></label>
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5F5A52">Šara<select style="font: inherit; font-size: 14px; min-height: 40px; padding: 0 8px; border: 1px solid #DDD8CE; border-radius: 6px; background: #FFFFFF"><option selected="{{selGrainYes}}">Po dužini ploče</option><option selected="{{selGrainNo}}">Bez šare</option></select></label>
          </div>
          <div role="group" aria-label="Površina" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5F5A52">Površina
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; padding: 3px; background: #F3F1EC; border-radius: 8px">
              <sc-for list="{{finishBtns}}" as="fb" hint-placeholder-count="3">
                <button type="button" aria-pressed="{{fb.sel}}" onClick="{{fb.pick}}" style="{{fb.style}}">{{fb.text}}</button>
              </sc-for>
            </div>
          </div>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5F5A52">Izvor i licenca teksture
            <select onChange="{{setLic}}" style="font: inherit; font-size: 14px; min-height: 40px; padding: 0 8px; border: 1px solid #DDD8CE; border-radius: 6px; background: #FFFFFF">
              <sc-for list="{{licOpts}}" as="lo" hint-placeholder-count="5"><option value="{{lo.v}}" selected="{{lo.sel}}">{{lo.t}}</option></sc-for>
            </select>
          </label>
          <div style="{{licNoteStyle}}">{{licNote}}</div>
        </aside>
      </div>
    </sc-if>

    <sc-if value="{{tabOpen}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <label style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 10px; padding: 14px 16px; font-size: 14px"><strong>Podrazumevano za nove projekte</strong>
          <select onChange="{{setDefOpen}}" style="font: inherit; font-size: 14px; min-height: 40px; padding: 0 8px; border: 1px solid #DDD8CE; border-radius: 6px; background: #FFFFFF">
            <sc-for list="{{defOpenOpts}}" as="d" hint-placeholder-count="4"><option value="{{d.v}}" selected="{{d.sel}}">{{d.t}}</option></sc-for>
          </select>
          <span style="color: #5F5A52; font-size: 13px">Projekat i pojedinačni element mogu da promene.</span>
        </label>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px">
          <sc-for list="{{openCards}}" as="oc" hint-placeholder-count="5">
            <section aria-label="{{oc.title}}" style="{{oc.style}}">
              <div style="display: flex; align-items: center; gap: 12px">
                <svg width="64" height="48" viewBox="0 0 64 48" aria-hidden="true"><rect x="4" y="4" width="56" height="40" rx="2" fill="#EADBC4" stroke="#1C1B19" stroke-width="1.4"></rect><path d="{{oc.d}}" fill="none" stroke="#1C1B19" stroke-width="{{oc.sw}}" stroke-linecap="round"></path></svg>
                <div style="flex: 1"><h2 style="margin: 0; font-size: 17px">{{oc.title}}</h2><div style="font-size: 12px; color: #5F5A52">{{oc.sub}}</div></div>
              </div>
              <sc-for list="{{oc.rows}}" as="r" hint-placeholder-count="3">
                <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px; border-top: 1px solid #EFEBE3; padding-top: 8px"><span style="color: #5F5A52">{{r.k}}</span><span style="text-align: right">{{r.v}}</span></div>
              </sc-for>
              <label style="display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 14px"><input type="checkbox" checked="{{oc.on}}" disabled="{{oc.locked}}" onChange="{{oc.toggle}}" style="width: 18px; height: 18px; accent-color: #2E6B4E">{{oc.onText}}</label>
            </section>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{tabApp}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-wrap: wrap; gap: 16px">
          <div style="flex: 1 1 320px; background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 10px; padding: 14px 16px; font-size: 13px; line-height: 1.55; color: #3D3A35"><strong style="color: #1C1B19">Generički modeli, bez brenda.</strong> Biblioteku održava Kroj tim i ista je za sve radionice. Aparat se sam smešta u nišu elementa (tačka umetanja: donji levi zadnji ugao). Prikazuju se samo u realnom 3D; u 2D, nacrtima i krojnoj listi ostaje simbol.</div>
          <div style="flex: 1 1 320px; background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 10px; padding: 14px 16px; font-size: 13px; line-height: 1.55; color: #3D3A35"><strong style="color: #1C1B19">Pravila licenci.</strong> Prihvatamo: CC0, kupljenu licencu za komercijalnu aplikaciju, sopstvene modele. Ne prihvatamo: CC-BY bez navođenja autora, nekomercijalne (NC) i „editorial only". Zasluge se ispisuju automatski na stranici „O aplikaciji".</div>
        </div>
        <div role="group" aria-label="Podrazumevana završna obrada aparata" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px">Podrazumevana obrada u projektima:
          <sc-for list="{{finBtns}}" as="fn" hint-placeholder-count="3">
            <button type="button" aria-pressed="{{fn.sel}}" onClick="{{fn.pick}}" style="{{fn.style}}"><span style="{{fn.dot}}"></span>{{fn.text}}</button>
          </sc-for>
        </div>
        <section aria-label="Aparati" style="background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 10px; padding: 8px 16px 16px">
          <div style="overflow-x: auto">
            <table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 820px">
              <thead><tr style="text-align: left; color: #5F5A52; font-size: 13px"><th style="padding: 12px 8px 12px 0; font-weight: 500">Model</th><th style="padding: 12px 8px; font-weight: 500">Niša / mere (mm)</th><th style="padding: 12px 8px; font-weight: 500">Obrade</th><th style="padding: 12px 8px; font-weight: 500; text-align: right">GLB</th><th style="padding: 12px 8px; font-weight: 500">Licenca · izvor</th><th style="padding: 12px 0 12px 8px; font-weight: 500">Status</th></tr></thead>
              <tbody>
                <sc-for list="{{apps}}" as="a" hint-placeholder-count="10">
                  <tr style="border-top: 1px solid #EEEAE2"><td style="padding: 8px 8px 8px 0"><div style="font-weight: 600">{{a.name}}</div><div style="font-size: 12px; color: #5F5A52">{{a.cat}}</div></td><td style="padding: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px">{{a.dims}}</td><td style="padding: 8px; font-size: 13px">{{a.fin}}</td><td style="padding: 8px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 13px">{{a.size}}</td><td style="padding: 8px; font-size: 13px">{{a.lic}}</td><td style="padding: 8px 0 8px 8px"><span style="{{a.stStyle}}">{{a.st}}</span></td></tr>
                </sc-for>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </sc-if>

    <sc-if value="{{tabCat}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <p style="margin: 0; font-size: 14px; color: #5F5A52; line-height: 1.5">Gotovi elementi koji se vide u biblioteci Prostora. Svaki je podrazumevana konfiguracija parametarskog elementa — širina, ručke i materijali se menjaju u projektu. Sakrij ono što radionica ne pravi.</p>
        <sc-for list="{{catGroups}}" as="cg" hint-placeholder-count="4">
          <section aria-label="{{cg.title}}" style="background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
            <h2 style="margin: 0; font-size: 16px">{{cg.title}} <span style="font: 13px 'IBM Plex Mono', monospace; color: #8A8378">{{cg.count}}</span></h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px">
              <sc-for list="{{cg.items}}" as="ci" hint-placeholder-count="6">
                <label style="{{ci.style}}">
                  <span style="height: 56px; display: flex; align-items: flex-end; justify-content: center"><svg viewBox="{{ci.vb}}" preserveAspectRatio="xMidYMax meet" aria-hidden="true" style="{{ci.svgStyle}}"><path d="{{ci.box}}" fill="#EADBC4" stroke="#1C1B19" stroke-width="1" vector-effect="non-scaling-stroke"></path><path d="{{ci.app}}" fill="#2B2A28"></path><path d="{{ci.glass}}" fill="#D6E3F5" stroke="#8A97AA" stroke-width="0.8" vector-effect="non-scaling-stroke"></path><path d="{{ci.lines}}" fill="none" stroke="#8A8378" stroke-width="0.8" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"></path><path d="{{ci.hand}}" fill="none" stroke="#1C1B19" stroke-width="{{ci.handW}}" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></span>
                  <span style="font-size: 13px; font-weight: 600; text-align: center">{{ci.name}}</span>
