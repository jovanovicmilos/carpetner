<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moja kuhinja — ponude</title>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F1EC}
a{color:#2E6B4E}a:hover{color:#1D4632}
.k-cs{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border-radius:16px;font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap;color:#F3F1EC}
.k-cs:hover{background:#2A3A31;color:#FFFFFF}
.k-cs[aria-current="step"],.k-cs[aria-current="step"]:hover{background:#F3F1EC;color:#1C1B19}
.k-cs:focus-visible,.k-btn:focus-visible{outline:2px solid #2E6B4E;outline-offset:2px}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B19; background: #F3F1EC; min-height: 1000px; display: flex; flex-direction: column">

<header style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px 16px; padding: 10px 20px; background: #1F2B24; color: #F3F1EC">
  <div style="display: flex; align-items: center; gap: 14px; min-width: 0">
    <a href="KupacStart.html" aria-label="Kroj — moje kuhinje" style="display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="3" width="22" height="22" rx="3" fill="none" stroke="#F3F1EC" stroke-width="2"></rect><path d="M3 11h22M11 11v14" stroke="#8CC5A2" stroke-width="2"></path></svg>
      <span style="font-weight: 700; font-size: 18px; letter-spacing: 0.02em">Kroj</span>
    </a>
    <span style="font-size: 14px; color: #D8D3C9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Moja kuhinja · <strong style="color: #FFFFFF; font-weight: 600">Ugaona 320 × 240</strong></span>
  </div>
  <nav aria-label="Koraci" style="display: flex; align-items: center; gap: 4px">
    <a href="KupacStart.html" class="k-cs" aria-label="Korak 1 od 5: Prostor — završeno"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #8CC5A2; display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#1C1B19" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>Prostor</a>
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" style="flex: none; margin: 0 2px"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="#8CC5A2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <a href="KupacEditor.html" class="k-cs" aria-label="Korak 2 od 5: Kuhinja — završeno"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #8CC5A2; display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#1C1B19" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>Kuhinja</a>
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" style="flex: none; margin: 0 2px"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="#8CC5A2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <a href="Pogled3D.html" class="k-cs" aria-label="Korak 3 od 5: Izgled — završeno"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #8CC5A2; display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#1C1B19" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>Izgled</a>
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" style="flex: none; margin: 0 2px"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="#8CC5A2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <a href="KupacPosalji.html" class="k-cs" aria-label="Korak 4 od 5: Pošalji stolaru — završeno"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #8CC5A2; display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#1C1B19" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>Pošalji stolaru</a>
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" style="flex: none; margin: 0 2px"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="#8CC5A2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <a href="KupacPonude.html" class="k-cs" aria-current="step" aria-label="Korak 5 od 5: Ponuda — u toku"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #2E6B4E; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font: 600 11px 'IBM Plex Mono', monospace">5</span>Ponuda</a>
  </nav>
  <div style="justify-self: end; display: flex; align-items: center; gap: 10px">
    <span style="font-size: 13px; color: #D8D3C9">Sačuvano</span>
    <a href="Prijava.html" style="font-size: 14px; color: #F3F1EC">Ana P.</a>
  </div>
</header>

<main style="width: 100%; max-width: 1280px; box-sizing: border-box; margin: 0 auto; padding: 24px 20px 40px; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
    <div>
      <h1 style="margin: 0; font-size: 28px">Ponude za tvoju kuhinju</h1>
      <p style="margin: 4px 0 0; font-size: 15px; color: #5F5A52">Plus važi do 18. 2. · poslato 2 od 3 stolara · cene su konačne za period važenja ponude</p>
    </div>
    <a href="Saradnja.html" style="margin-left: auto; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 8px; border: 1px solid #BDB5A6; background: #FFFFFF; color: #1C1B19; text-decoration: none; font-weight: 600; font-size: 14px">Poruke <span style="min-width: 22px; height: 22px; border-radius: 11px; background: #2E6B4E; color: #FFFFFF; font-size: 12px; display: inline-flex; align-items: center; justify-content: center">2</span></a>
  </div>

  <sc-if value="{{accepted}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: #E4F1E6; color: #1F5A2A; border-radius: 10px; padding: 14px 16px; font-size: 15px">
      <strong>Ponuda prihvaćena.</strong> [Radionica A] dobija potvrdu i predlaže termin za merenje. Ostalim stolarima javljamo da je posao dogovoren.
      <button type="button" class="k-btn" onClick="{{undo}}" style="margin-left: auto; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #1F5A2A; background: #FFFFFF; color: #1F5A2A; font: 600 14px 'IBM Plex Sans', sans-serif; cursor: pointer">Poništi (još 10 min)</button>
    </div>
  </sc-if>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: stretch">
    <article aria-labelledby="oa" style="background: #FFFFFF; border: 2px solid #2E6B4E; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 8px">
        <h2 id="oa" style="margin: 0; font-size: 18px">[Radionica A]</h2>
        <span style="margin-left: auto; font-size: 12px; padding: 3px 9px; border-radius: 10px; background: #E2EFE6; color: #1D4632; font-weight: 600">Ponuda v2</span>
      </div>
      <div>
        <div style="font: 700 28px 'IBM Plex Mono', monospace">268.066 RSD</div>
        <div style="font-size: 13px; color: #5F5A52">sa PDV-om · važi do 5. 12. · avans 40 %</div>
      </div>
      <div style="background: #F2F8F4; border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.45; color: #1D4632">U okviru primera cene (240.000–290.000 RSD). Stolar navodi: radna ploča hrast 38 mm umesto 28 mm.</div>
      <div aria-hidden="true" style="height: 150px; border-radius: 8px; background: linear-gradient(180deg, #FAF8F4 0 55%, #C49A6C 55% 60%, #EADBC4 60% 100%); border: 1px solid #DDD8CE; position: relative"><span style="position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: #3D3A35; background: rgba(255,255,255,0.85); padding: 2px 6px; border-radius: 4px">Slika iz ponude (3D)</span></div>
      <dl style="margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; font-size: 14px">
        <dt style="color: #5F5A52">Uključeno</dt><dd style="margin: 0">elementi, radna ploča, okov Blum, prevoz, montaža</dd>
        <dt style="color: #5F5A52">Nije uključeno</dt><dd style="margin: 0">aparati, sudopera i slavina, električni radovi</dd>
        <dt style="color: #5F5A52">Rok</dt><dd style="margin: 0">5 nedelja od merenja</dd>
      </dl>
      <div style="border-top: 1px solid #EEEAE2; padding-top: 12px; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 14px; font-weight: 600">3 izmene u odnosu na tvoj projekat</div>
        <ul style="margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.5; color: #3D3A35">
          <li>sudopera pomerena 20 cm — odvod je na 145 cm</li>
          <li>fioke 60 → 2 × 30 kod ploče za kuvanje</li>
          <li>dodata završna lajsna uz zid B</li>
        </ul>
        <a href="Saradnja.html" style="font-size: 14px; min-height: 32px; display: inline-flex; align-items: center">Poruke i kuhinja</a>
      </div>
      <div style="margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" class="k-btn" onClick="{{accept}}" disabled="{{accepted}}" style="flex: 1 1 100%; min-height: 48px; border-radius: 8px; border: 0; background: #2E6B4E; color: #FFFFFF; font: 600 16px 'IBM Plex Sans', sans-serif; cursor: pointer">Prihvati ponudu</button>
        <a href="Saradnja.html" style="flex: 1; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #BDB5A6; color: #1C1B19; text-decoration: none; font-weight: 600; font-size: 14px">Traži izmene</a>
        <button type="button" class="k-btn" style="flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid #BDB5A6; background: #FFFFFF; color: #1C1B19; font: 600 14px 'IBM Plex Sans', sans-serif; cursor: pointer">Odbij</button>
        <a href="#" style="flex: 1 1 100%; text-align: center; font-size: 14px; min-height: 32px; display: inline-flex; align-items: center; justify-content: center">Ponuda u PDF-u</a>
      </div>
    </article>

    <article aria-labelledby="ob" style="background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 8px">
        <h2 id="ob" style="margin: 0; font-size: 18px">[Radionica B]</h2>
        <span style="margin-left: auto; font-size: 12px; padding: 3px 9px; border-radius: 10px; background: #F3F1EC; color: #3D3A35; font-weight: 600">Pregleda projekat</span>
      </div>
      <div style="font-size: 15px; color: #3D3A35">Ponuda još nije stigla.</div>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 14px">
        <li style="display: flex; gap: 10px"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: #8CC5A2; flex: none"></span><span>Poslato <span style="color: #5F5A52">· 18. 11.</span></span></li>
        <li style="display: flex; gap: 10px"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: #8CC5A2; flex: none"></span><span>Stolar preuzeo projekat <span style="color: #5F5A52">· 19. 11.</span></span></li>
        <li style="display: flex; gap: 10px"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid #2E6B4E; box-sizing: border-box; flex: none"></span><span>Merenje <strong>24. 11. u 17:00</strong> <span style="color: #5F5A52">· potvrđeno</span></span></li>
        <li style="display: flex; gap: 10px; color: #8A8378"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #BDB6AA; box-sizing: border-box; flex: none"></span><span>Ponuda</span></li>
      </ol>
      <a href="Saradnja.html" style="margin-top: auto; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #BDB5A6; color: #1C1B19; text-decoration: none; font-weight: 600; font-size: 14px">Poruke i kuhinja</a>
    </article>

    <article aria-labelledby="oc" style="background: transparent; border: 1px dashed #BDB5A6; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px; justify-content: center; align-items: flex-start">
      <h2 id="oc" style="margin: 0; font-size: 17px">Još jedan stolar</h2>
      <p style="margin: 0; font-size: 14px; color: #5F5A52; line-height: 1.45">U Plus-u ti je ostalo još 1 slanje (do 18. 2.). Projekat se šalje takav kakav je sada.</p>
      <a href="KupacPosalji.html" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 8px; border: 1px solid #2E6B4E; color: #1D4632; text-decoration: none; font-weight: 600; font-size: 14px">Izaberi stolara</a>
    </article>
  </div>

  <p style="margin: 0; font-size: 13px; color: #5F5A52">Cene stolara vidiš samo u njihovim ponudama. Primer cene je bio okviran i nije obavezujući.</p>
</main>
</div>
</script>
<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { accepted: false }; }
  renderVals() {
    var self = this;
    return { accepted: this.state.accepted, accept: function () { self.setState({ accepted: true }); }, undo: function () { self.setState({ accepted: false }); } };
  }
}
</script>
<script>window.DC_PROPS = {};</script>
<script src="dc-lite.js"></script>
</body>
</html>
