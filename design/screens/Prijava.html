<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kroj — prijava</title>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F1EC}
a{color:#2E6B4E}a:hover{color:#1D4632}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B19; background: #F3F1EC; min-height: 900px; display: flex; flex-wrap: wrap">
  <section style="flex: 1 1 520px; min-width: 0; background: #1F2B24; color: #F3F1EC; padding: 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
    <a href="Sajt.html" style="display: flex; align-items: center; gap: 10px; color: #F3F1EC; text-decoration: none">
      <svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><path d="M11.2 25.4c1.3-.5 2-1.8 2.1-3.8l.1-4.3h1.2l.1 4.3c.1 2 .8 3.3 2.1 3.8z" fill="#C49A6C"></path><path d="M13.9 18.4 10.6 16M14 18v-2.4M14.4 18.3l3.4-2.5" fill="none" stroke="#C49A6C" stroke-width="1.1" stroke-linecap="round"></path><path d="M9.6 25.4h8.8" stroke="#C49A6C" stroke-width="1.2" stroke-linecap="round"></path><path d="M3.6 15.2a2.6 2.6 0 0 1 .6-4.6a3 3 0 0 1 3.4-4.2a3.4 3.4 0 0 1 5-2.6a3.4 3.4 0 0 1 5.2.6a3 3 0 0 1 4 3.4a2.8 2.8 0 0 1 2.4 4a2.4 2.4 0 0 1-.4 4.2a2.6 2.6 0 0 1-4 .8a2.4 2.4 0 0 1-3.4.4a2.4 2.4 0 0 1-3.6 0a2.4 2.4 0 0 1-3.4-.4a2.6 2.6 0 0 1-4-.8a1.8 1.8 0 0 1-1.8-.8z" fill="#5E9B74"></path><path d="M3.9 12.9a2.6 2.6 0 0 1 .3-2.3a3 3 0 0 1 3.4-4.2a3.4 3.4 0 0 1 5-2.6a3.4 3.4 0 0 1 5.2.6a3 3 0 0 1 4 3.4a2.8 2.8 0 0 1 2.4 4a2.2 2.2 0 0 1-.3 1.4c-1-.7-2.3-.6-3.1.2c-.9-.8-2.4-.8-3.3 0c-1-.9-2.6-.9-3.6 0c-.9-.8-2.4-.8-3.3 0c-.8-.8-2.1-.9-3.1-.2c-.8-.4-1.4-.4-1.9-.2z" fill="#8CC5A2"></path><path d="M7.2 9.2a2.2 2.2 0 0 1 2.4-2.4a2.6 2.6 0 0 1 4.2-1.4a2.4 2.4 0 0 1 2.6.2c-1.6.2-2.6 1-3 2.2c-1.4-.6-3 0-3.6 1.4c-1-.4-2-.4-2.6 0z" fill="#B5DCC2"></path></svg>
      <span style="font-weight: 700; font-size: 20px">Kroj</span>
    </a>
    <h1 style="margin: auto 0 0; font-size: 40px; line-height: 1.1; max-width: 520px">Tvoja radionica, tvoje mere, tvoje cene.</h1>
    <div style="display: flex; flex-direction: column; gap: 12px; font-size: 16px; color: #D8D3C9; max-width: 480px">
      <div style="display: flex; gap: 12px"><span style="font-family: 'IBM Plex Mono', monospace; color: #8CC5A2">→</span><span>Projekti su vezani za radionicu, ne za računar — rade na tabletu u stanu kupca i na računaru u radionici.</span></div>
      <div style="display: flex; gap: 12px"><span style="font-family: 'IBM Plex Mono', monospace; color: #8CC5A2">→</span><span>Vlasnik radionice postavlja cenovnik i pravila, majstori crtaju i šalju krojne liste.</span></div>
    </div>
    <div style="margin-top: auto; font-size: 13px; color: #C9C3B8">14 dana besplatno · bez kartice</div>
  </section>

  <main style="flex: 1 1 480px; min-width: 0; padding: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
    <form style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 18px" onSubmit="{{noop}}">
      <div role="tablist" aria-label="Nalog" style="display: flex; border: 1px solid #DDD8CE; border-radius: 8px; overflow: hidden; background: #FFFFFF">
        <button type="button" role="tab" aria-selected="{{loginSel}}" onClick="{{setLogin}}" style="{{loginStyle}}">Prijava</button>
        <button type="button" role="tab" aria-selected="{{regSel}}" onClick="{{setReg}}" style="{{regStyle}}">Nova radionica</button>
      </div>
      <h2 style="margin: 0; font-size: 26px">{{heading}}</h2>
      <sc-if value="{{reg}}" hint-placeholder-val="{{ false }}">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">Naziv radionice<input type="text" autocomplete="organization" style="font: inherit; font-size: 16px; padding: 12px; border: 1px solid #BDB5A6; border-radius: 6px; background: #FFFFFF"></label>
      </sc-if>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">E-pošta<input type="email" autocomplete="email" style="font: inherit; font-size: 16px; padding: 12px; border: 1px solid #BDB5A6; border-radius: 6px; background: #FFFFFF"></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">Lozinka<input type="password" autocomplete="current-password" style="font: inherit; font-size: 16px; padding: 12px; border: 1px solid #BDB5A6; border-radius: 6px; background: #FFFFFF"></label>
      <sc-if value="{{login}}" hint-placeholder-val="{{ true }}">
        <a href="Prijava.html" style="font-size: 14px; align-self: flex-end">Zaboravljena lozinka?</a>
      </sc-if>
      <a href="BrziStart.html" style="display: inline-flex; justify-content: center; align-items: center; min-height: 50px; border-radius: 6px; background: #2E6B4E; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600">{{cta}}</a>
      <div style="display: flex; align-items: center; gap: 12px; color: #5F5A52; font-size: 13px"><span style="flex: 1; height: 1px; background: #DDD8CE"></span>ili<span style="flex: 1; height: 1px; background: #DDD8CE"></span></div>
      <button type="button" style="font: inherit; font-size: 15px; min-height: 48px; border-radius: 6px; border: 1px solid #BDB5A6; background: #FFFFFF; color: #1C1B19">Nastavi sa Google nalogom</button>
      <p style="margin: 0; font-size: 13px; color: #5F5A52; line-height: 1.5">Pozvan si od strane radionice? Otvori link iz pozivnice — nalog se automatski veže za tu radionicu.</p>
    </form>
  </main>
</div>
</script>
<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { reg: false }; }
  renderVals() {
    const on = 'flex: 1; font: inherit; font-size: 15px; font-weight: 600; min-height: 46px; border: 0; background: #1F2B24; color: #FFFFFF';
    const off = 'flex: 1; font: inherit; font-size: 15px; min-height: 46px; border: 0; background: #FFFFFF; color: #1C1B19';
    const reg = this.state.reg;
    return {
      reg, login: !reg,
      heading: reg ? 'Otvori nalog radionice' : 'Dobro došao nazad',
      cta: reg ? 'Započni 14 dana probe' : 'Prijavi se',
      loginStyle: reg ? off : on, regStyle: reg ? on : off,
      loginSel: reg ? 'false' : 'true', regSel: reg ? 'true' : 'false',
      setLogin: () => this.setState({ reg: false }), setReg: () => this.setState({ reg: true }),
      noop: (e) => { if (e && e.preventDefault) e.preventDefault(); }
    };
  }
}
</script>
<script>window.DC_PROPS = {};</script>
<script src="dc-lite.js"></script>
</body>
</html>
