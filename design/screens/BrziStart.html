<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novi projekat — brzi start</title>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F1EC}
a{color:#2E6B4E}a:hover{color:#1D4632}
.k-top{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:6px;font-size:14px;font-weight:500;color:#F3F1EC;text-decoration:none;white-space:nowrap}
.k-top:hover{background:#2A3A31;color:#FFFFFF}
.k-top[aria-current="page"],.k-top[aria-current="page"]:hover{background:#F3F1EC;color:#1C1B19}
.k-sec{border:0;background:transparent;width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;font:inherit;color:#1C1B19;cursor:pointer;text-align:left}
.k-sec:hover{background:#FAF8F4}
.k-top:focus-visible,.k-btn:focus-visible,.k-sec:focus-visible,.k-mark:focus-visible{outline:2px solid #2E6B4E;outline-offset:2px}
input:focus-visible{outline:2px solid #2E6B4E;outline-offset:1px}
.k-mark{cursor:grab}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B19; background: #F3F1EC; height: 920px; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; align-items: center; gap: 14px; height: 52px; box-sizing: border-box; padding: 0 16px; background: #1F2B24; color: #F3F1EC; flex: none">
  <a href="Projekti.html" aria-label="Kroj — projekti" style="display: flex; align-items: center; gap: 9px; color: inherit; text-decoration: none">
    <svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="3" width="22" height="22" rx="3" fill="none" stroke="#F3F1EC" stroke-width="2"></rect><path d="M3 11h22M11 11v14" stroke="#8CC5A2" stroke-width="2"></path></svg>
    <span style="font-weight: 700; font-size: 17px">Kroj</span>
  </a>
  <nav aria-label="Glavni meni" style="display: flex; align-items: center; gap: 2px; margin-left: 6px">
    <a href="Projekti.html" class="k-top" aria-current="page">Projekti</a>
    <a href="Upiti.html" class="k-top">Upiti <span aria-label="3 nova" style="min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: #8CC5A2; color: #1C1B19; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">3</span></a>
  </nav>
  <div style="margin-left: auto; display: flex; align-items: center; gap: 8px">
    <a href="Pretplata.html" style="font-size: 12.5px; color: #1C1B19; background: #8CC5A2; border-radius: 12px; padding: 4px 10px; text-decoration: none; font-weight: 600">Pro · proba još 12 dana</a>
    <a href="AdminShell.html" style="min-height: 36px; padding: 0 12px; border-radius: 6px; display: inline-flex; align-items: center; gap: 7px; font: 600 14px 'IBM Plex Sans', sans-serif; color: #F3F1EC; border: 1px solid #3E5045; text-decoration: none">Radionica <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg></a>
    <span title="Marko — [Radionica A]" style="width: 32px; height: 32px; border-radius: 50%; background: #6B4A33; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font: 700 13px 'IBM Plex Sans', sans-serif; border: 2px solid #3E5045">M</span>
  </div>
</header>

<div style="display: flex; align-items: center; gap: 14px; height: 54px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #DDD8CE; flex: none">
  <a href="Projekti.html" style="font-size: 14px; min-height: 36px; display: inline-flex; align-items: center">← Projekti</a>
  <h1 style="margin: 0; font-size: 18px">Novi projekat</h1>
  <div role="tablist" aria-label="Kako počinješ" style="display: inline-flex; background: #F3F1EC; border-radius: 8px; padding: 3px; margin-left: 8px">
    <sc-for list="{{starts}}" as="t" hint-placeholder-count="4"><a href="{{t.href}}" role="tab" aria-selected="{{t.on}}" style="{{t.style}}">{{t.text}}<sc-if value="{{t.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #8CC5A2; color: #1C1B19; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">{{t.badge}}</span></sc-if></a></sc-for>
  </div>
  <div role="group" aria-label="Jedinice mere" style="margin-left: auto; display: flex; border: 1px solid #BDB5A6; border-radius: 6px; overflow: hidden">
    <sc-for list="{{units}}" as="u" hint-placeholder-count="2"><button type="button" aria-pressed="{{u.on}}" onClick="{{u.pick}}" style="{{u.style}}">{{u.t}}</button></sc-for>
  </div>
</div>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 380px minmax(0, 1fr) 320px">
  <aside aria-label="Podaci za raspored" style="background: #FFFFFF; border-right: 1px solid #DDD8CE; overflow-y: auto">
    <div style="padding: 14px 16px 6px">
      <p style="margin: 0; font-size: 14px; color: #3D3A35; line-height: 1.45">Popuni šta znaš — plan desno se slaže odmah. Sve kasnije menjaš u editoru.</p>
    </div>
    <sc-for list="{{secs}}" as="sc" hint-placeholder-count="6">
      <section style="border-top: 1px solid #EEEAE2">
        <button type="button" class="k-sec" aria-expanded="{{sc.open}}" onClick="{{sc.toggle}}">
          <span aria-hidden="true" style="{{sc.dot}}"><sc-if value="{{sc.done}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#1C1B19" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if><sc-if value="{{sc.notDone}}" hint-placeholder-val="{{ true }}">{{sc.n}}</sc-if></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">{{sc.t}}</span><span style="font-size: 12.5px; color: #5F5A52; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{sc.sum}}</span></span>
          <svg width="12" height="12" viewBox="0 0 10 10" aria-hidden="true" style="{{sc.chev}}"><path d="M2 3.5l3 3 3-3" fill="none" stroke="#5F5A52" stroke-width="1.5"></path></svg>
        </button>
        <sc-if value="{{sc.isProj}}" hint-placeholder-val="{{ false }}"><div style="padding: 0 16px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5F5A52; grid-column: 1 / -1">Naziv projekta<input type="text" value="{{name}}" onInput="{{setName}}" style="min-height: 40px; box-sizing: border-box; padding: 0 10px; border: 1px solid #BDB5A6; border-radius: 6px; font: 15px 'IBM Plex Sans', sans-serif; color: #1C1B19"></label>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5F5A52">Kupac (nije obavezno)<input type="text" value="Petrović" style="min-height: 40px; box-sizing: border-box; padding: 0 10px; border: 1px solid #BDB5A6; border-radius: 6px; font: 15px 'IBM Plex Sans', sans-serif; color: #1C1B19"></label>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5F5A52">Mesto<input type="text" value="Novi Sad" style="min-height: 40px; box-sizing: border-box; padding: 0 10px; border: 1px solid #BDB5A6; border-radius: 6px; font: 15px 'IBM Plex Sans', sans-serif; color: #1C1B19"></label>
        </div></sc-if>
        <sc-if value="{{sc.isShape}}" hint-placeholder-val="{{ true }}"><div role="radiogroup" aria-label="Oblik" style="padding: 0 16px 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px">
          <sc-for list="{{shapes}}" as="s" hint-placeholder-count="4"><button type="button" role="radio" class="k-btn" aria-checked="{{s.on}}" onClick="{{s.pick}}" style="{{s.style}}"><svg width="44" height="34" viewBox="0 0 44 34" aria-hidden="true"><path d="{{s.d}}" fill="none" stroke="#1C1B19" stroke-width="4"></path><sc-if value="{{s.island}}" hint-placeholder-val="{{ false }}"><rect x="14" y="20" width="16" height="8" fill="#EADBC4" stroke="#1C1B19" stroke-width="1.4"></rect></sc-if></svg><span style="font-size: 12.5px; font-weight: 600">{{s.name}}</span></button></sc-for>
        </div></sc-if>
        <sc-if value="{{sc.isWalls}}" hint-placeholder-val="{{ true }}"><div style="padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px">
          <sc-for list="{{walls}}" as="w" hint-placeholder-count="3">
            <label style="display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; font-size: 14px">{{w.label}}
              <span style="display: inline-flex; align-items: center; border: 1px solid #BDB5A6; border-radius: 6px; overflow: hidden">
                <button type="button" class="k-btn" aria-label="{{w.minusLabel}}" onClick="{{w.minus}}" style="width: 36px; height: 40px; border: 0; border-right: 1px solid #DDD8CE; background: #FFFFFF; font: 600 17px 'IBM Plex Sans', sans-serif; cursor: pointer">−</button>
                <input type="text" inputmode="numeric" value="{{w.value}}" onChange="{{w.set}}" style="width: 78px; height: 40px; box-sizing: border-box; border: 0; text-align: center; font: 600 15px 'IBM Plex Mono', monospace; color: #1C1B19">
                <button type="button" class="k-btn" aria-label="{{w.plusLabel}}" onClick="{{w.plus}}" style="width: 36px; height: 40px; border: 0; border-left: 1px solid #DDD8CE; background: #FFFFFF; font: 600 17px 'IBM Plex Sans', sans-serif; cursor: pointer">+</button>
              </span></label>
          </sc-for>
          <span style="font-size: 12.5px; color: #5F5A52">Unos u {{unitName}}; Enter potvrđuje, strelice ±{{stepText}}.</span>
        </div></sc-if>
        <sc-if value="{{sc.isInst}}" hint-placeholder-val="{{ false }}"><div style="padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; gap: 8px; align-items: flex-start; background: #F2F8F4; border-radius: 8px; padding: 9px 11px; font-size: 13px; color: #1D4632; line-height: 1.4"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M8 1v14M1 8h14M8 1l-2 2M8 1l2 2M8 15l-2-2M8 15l2-2M1 8l2-2M1 8l2 2M15 8l-2-2M15 8l-2 2" fill="none" stroke="currentColor" stroke-width="1.3"></path></svg>Prevuci oznake na planu ili upiši mere od ugla.</div>
          <sc-for list="{{inst}}" as="i" hint-placeholder-count="3">
            <div style="display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: 10px; font-size: 14px">
              <span aria-hidden="true" style="{{i.dot}}">{{i.l}}</span><span>{{i.t}}</span>
              <input type="text" inputmode="numeric" value="{{i.v}}" aria-label="{{i.aria}}" style="width: 84px; height: 38px; box-sizing: border-box; padding: 0 8px; border: 1px solid #BDB5A6; border-radius: 6px; text-align: right; font: 600 14px 'IBM Plex Mono', monospace">
            </div>
          </sc-for>
        </div></sc-if>
        <sc-if value="{{sc.isWant}}" hint-placeholder-val="{{ false }}"><div style="padding: 0 16px 16px; display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{wants}}" as="w" hint-placeholder-count="6"><button type="button" class="k-btn" aria-pressed="{{w.on}}" onClick="{{w.toggle}}" style="{{w.style}}"><sc-if value="{{w.isOn}}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#1D4632" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>{{w.t}}</button></sc-for>
        </div></sc-if>
        <sc-if value="{{sc.isMat}}" hint-placeholder-val="{{ false }}"><div role="radiogroup" aria-label="Materijali i mere" style="padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{mats}}" as="m" hint-placeholder-count="3"><button type="button" role="radio" class="k-btn" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="{{m.style}}"><span aria-hidden="true" style="display: flex; gap: 3px"><span style="{{m.s1}}"></span><span style="{{m.s2}}"></span></span><span style="display: flex; flex-direction: column; text-align: left"><span style="font-size: 14px; font-weight: 600">{{m.t}}</span><span style="font-size: 12.5px; color: #5F5A52">{{m.d}}</span></span></button></sc-for>
        </div></sc-if>
      </section>
    </sc-for>
  </aside>

  <main aria-label="Pregled rasporeda" style="min-width: 0; min-height: 0; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px">
      <h2 style="margin: 0; font-size: 17px">Složeno automatski</h2>
      <span style="font-size: 13.5px; color: #5F5A52">{{counts}}</span>
      <span role="radiogroup" aria-label="Pogled" style="margin-left: auto; display: inline-flex; background: #E8E4DC; border-radius: 8px; padding: 3px">
        <sc-for list="{{views}}" as="v" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{v.on}}" onClick="{{v.pick}}" style="{{v.style}}">{{v.text}}</button></sc-for>
      </span>
    </div>
    <div style="flex: 1; min-height: 0; margin: 0 16px 16px; position: relative; border: 1px solid #DDD8CE; border-radius: 10px; background-color: #FAF8F4; background-image: linear-gradient(#E4DFD5 1px, transparent 1px), linear-gradient(90deg, #E4DFD5 1px, transparent 1px); background-size: 40px 40px; overflow: hidden">
      <sc-if value="{{isPlan}}" hint-placeholder-val="{{ true }}">
        <svg viewBox="0 0 700 560" role="img" aria-label="{{planLabel}}" style="position: absolute; inset: 0; width: 100%; height: 100%">
          <path d="{{wallPath}}" fill="none" stroke="#1C1B19" stroke-width="10" stroke-linecap="square"></path>
          <sc-if value="{{hasWindow}}" hint-placeholder-val="{{ true }}"><rect x="{{win.x}}" y="{{win.y}}" width="{{win.w}}" height="10" fill="#DCE7F7" stroke="#1C1B19" stroke-width="1"></rect></sc-if>
          <sc-for list="{{rects}}" as="r" hint-placeholder-count="10"><rect x="{{r.x}}" y="{{r.y}}" width="{{r.w}}" height="{{r.h}}" fill="{{r.fill}}" stroke="#1C1B19" stroke-width="1.1" stroke-dasharray="{{r.dash}}"></rect><text x="{{r.tx}}" y="{{r.ty}}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="600" fill="{{r.ink}}">{{r.label}}</text></sc-for>
          <sc-for list="{{dims}}" as="d" hint-placeholder-count="2"><text x="{{d.x}}" y="{{d.y}}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#5F5A52" transform="{{d.rot}}">{{d.t}}</text></sc-for>
          <sc-for list="{{marks}}" as="m" hint-placeholder-count="2"><g class="k-mark" tabindex="0" role="slider" aria-label="{{m.aria}}" aria-valuenow="{{m.val}}"><circle cx="{{m.x}}" cy="{{m.y}}" r="12" fill="{{m.fill}}" stroke="#FFFFFF" stroke-width="2.5"></circle><text x="{{m.x}}" y="{{m.ty}}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="700" fill="{{m.ink}}">{{m.l}}</text><path d="{{m.arrow}}" fill="none" stroke="#5F5A52" stroke-width="1.2"></path></g></sc-for>
        </svg>
      </sc-if>
      <sc-if value="{{is3d}}" hint-placeholder-val="{{ false }}">
        <div role="img" aria-label="Brzi 3D pregled" style="position: absolute; inset: 0; background: linear-gradient(180deg, #F3EEE6 0 50%, #E6DED1 50% 100%)">
          <span style="position: absolute; left: 10%; right: 32%; top: 16%; height: 22%; background: #FFFFFF; border: 1px solid #CFC7B8"></span>
          <span style="position: absolute; left: 10%; right: 32%; top: 52%; height: 3%; background: #C49A6C"></span>
          <span style="position: absolute; left: 10%; right: 32%; top: 55%; height: 30%; background: #FFFFFF; border: 1px solid #CFC7B8"></span>
          <span style="position: absolute; right: 14%; top: 12%; width: 14%; bottom: 15%; background: #FFFFFF; border: 1px solid #CFC7B8"></span>
        </div>
      </sc-if>
      <div style="position: absolute; left: 12px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: #3D3A35; background: rgba(255,255,255,0.92); border: 1px solid #DDD8CE; border-radius: 8px; padding: 6px 10px">
        <span style="display: inline-flex; align-items: center; gap: 5px"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #1E50C8"></span>voda i odvod</span>
        <span style="display: inline-flex; align-items: center; gap: 5px"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #F2B630"></span>trofazna struja</span>
        <span style="display: inline-flex; align-items: center; gap: 5px"><span aria-hidden="true" style="width: 14px; height: 8px; border: 1.2px dashed #1C1B19"></span>gornji</span>
      </div>
    </div>
  </main>

  <aside aria-label="Rezultat" style="background: #FFFFFF; border-left: 1px solid #DDD8CE; display: flex; flex-direction: column; min-height: 0">
    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
        <sc-for list="{{stats}}" as="t" hint-placeholder-count="4"><div style="background: #FAF8F4; border: 1px solid #EEEAE2; border-radius: 8px; padding: 9px 10px"><div style="font-size: 12px; color: #5F5A52">{{t.k}}</div><div style="font: 600 17px 'IBM Plex Mono', monospace">{{t.v}}</div></div></sc-for>
      </div>
      <div style="background: #F2F8F4; border: 1px solid #A9D6BA; border-radius: 8px; padding: 10px 12px">
        <div style="font-size: 12.5px; color: #1D4632">Procena po tvom cenovniku</div>
        <div style="font: 700 20px 'IBM Plex Mono', monospace; color: #1C1B19">≈ {{price}} RSD</div>
        <div style="font-size: 12px; color: #3D3A35">materijal, kant, okov, rad · bez montaže</div>
      </div>
      <section aria-labelledby="w-h" style="display: flex; flex-direction: column; gap: 6px">
        <h3 id="w-h" style="margin: 0; font-size: 14px">{{warnTitle}}</h3>
        <sc-for list="{{warns}}" as="w" hint-placeholder-count="1">
          <div style="display: flex; gap: 8px; align-items: flex-start; background: #FBE3D3; color: #7C2D0A; border-radius: 8px; padding: 9px 10px; font-size: 13px; line-height: 1.4">
            <svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M9 2l7.5 13h-15z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path><path d="M9 7v4M9 13v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
            <span style="flex: 1">{{w.t}}</span>
            <button type="button" class="k-btn" onClick="{{w.fix}}" style="flex: none; min-height: 28px; padding: 0 8px; border-radius: 6px; border: 1px solid #E2804D; background: #FFFFFF; color: #7C2D0A; font: 600 12px 'IBM Plex Sans', sans-serif; cursor: pointer">{{w.fixText}}</button>
          </div>
        </sc-for>
        <sc-if value="{{noWarn}}" hint-placeholder-val="{{ false }}"><div style="background: #E4F1E6; color: #1F5A2A; border-radius: 8px; padding: 9px 10px; font-size: 13px">Sve po pravilima radionice.</div></sc-if>
      </section>
      <section aria-labelledby="l-h" style="display: flex; flex-direction: column; gap: 6px">
        <h3 id="l-h" style="margin: 0; font-size: 14px">Elementi</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 5px">
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="10"><span style="{{c.style}}">{{c.t}}</span></sc-for>
        </div>
      </section>
    </div>
    <div style="border-top: 1px solid #DDD8CE; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
      <a href="Main.html" style="min-height: 48px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; background: #2E6B4E; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px">Napravi projekat i doteraj</a>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
        <a href="KrojnaLista.html" style="min-height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #BDB5A6; color: #1C1B19; text-decoration: none; font-weight: 600; font-size: 13.5px">Odmah krojna lista</a>
        <a href="Obracun.html" style="min-height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #BDB5A6; color: #1C1B19; text-decoration: none; font-weight: 600; font-size: 13.5px">Odmah ponuda</a>
      </div>
    </div>
  </aside>
</div>
</div>
</script>
<script type="text/x-dc-logic" id="dc-logic">
// Workshop quick start (docs/BRZI_START.md): same input and autoLayout; new layout: accordion of inputs, live plan with
// draggable installation markers, result panel with estimate, warnings with a fix, and the three actions.
var SHAPES = [['I', 'Ravna', 'M4 6H40'], ['L', 'Ugaona', 'M4 32V6H40'], ['U', 'U oblik', 'M4 32V6H40V32'], ['O', 'Ostrvo', 'M4 6H40']];
var W = { base: '#EADBC4', sink: '#C9DAF2', oven: '#3A3936', tall: '#D6BE98', fill: '#E0CCAD', up: 'rgba(46,107,78,0.10)', dw: '#FFFFFF' };
