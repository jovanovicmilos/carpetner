<section id="paketi" style="max-width: 1200px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 64px 24px; display: flex; flex-direction: column; gap: 28px">

      <a href="Prijava.html" style="margin-top: auto; display: inline-flex; justify-content: center; align-items: center; min-height: 48px; border-radius: 6px; background: #E2804D; color: #1C1B19; text-decoration: none; font-weight: 600">Izaberi Radionicu</a>

<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { y: false }; }
  renderVals() {
    const on = 'font: inherit; font-size: 14px; padding: 10px 14px; min-height: 44px; border: 0; background: #1C1B19; color: #FFFFFF; font-weight: 600';
    const off = 'font: inherit; font-size: 14px; padding: 10px 14px; min-height: 44px; border: 0; background: transparent; color: #1C1B19';
    const y = this.state.y;
    return {
      per: y ? '/ godišnje' : '/ mesečno',
      mStyle: y ? off : on, yStyle: y ? on : off,
      mPressed: y ? 'false' : 'true', yPressed: y ? 'true' : 'false',
      setM: () => this.setState({ y: false }), setY: () => this.setState({ y: true })
    };
  }
}
</script>
