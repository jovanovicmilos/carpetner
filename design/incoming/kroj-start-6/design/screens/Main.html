<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prostor — 2D editor</title>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F1EC;overflow:hidden}
.k-body{flex-direction:row}
@media (max-width: 900px){
.k-body{flex-direction:column}
.k-lib{flex:0 0 auto !important;max-height:150px;border-right:0 !important;border-bottom:1px solid #DDD8CE}
.k-props{flex:0 0 auto !important;max-height:38vh;border-left:0 !important;border-top:1px solid #DDD8CE}
}
a{color:#B4440E}a:hover{color:#7C2D0A}
.k-tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;min-width:18px;margin-left:6px;padding:0;border-radius:50%;border:1px solid #8A8378;background:#FFFFFF;color:#5F5A52;font:600 11px 'IBM Plex Sans',sans-serif;cursor:help;vertical-align:middle;flex:none;text-transform:none;letter-spacing:0}
.k-tip:hover,.k-tip:focus-visible{background:#1C1B19;color:#FFFFFF;border-color:#1C1B19;outline:none}
.k-tip .k-pop{display:none;position:absolute;z-index:60;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:240px;background:#1C1B19;color:#F3F1EC;font:400 12.5px/1.45 'IBM Plex Sans',sans-serif;text-align:left;padding:8px 10px;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,0.18);white-space:normal;pointer-events:none}
.k-tip:hover .k-pop,.k-tip:focus .k-pop{display:block}
.k-tip.k-up .k-pop{top:auto;bottom:calc(100% + 8px)}
.k-tip.k-l .k-pop{left:auto;right:-6px;transform:none}
.k-tip.k-r .k-pop{left:-6px;transform:none}
.k-helpoff .k-tip{display:none}

</style>
</helmet>
<div class="{{helpClass}} k-shell" style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B19; background: #F3F1EC; height: 100vh; min-height: 560px; overflow: hidden; display: flex; flex-direction: column">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 10px 20px; background: #1C1B19; color: #F3F1EC">
  <div style="display: flex; align-items: center; gap: 10px">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="3" width="22" height="22" rx="3" fill="none" stroke="#F3F1EC" stroke-width="2"></rect><path d="M3 11h22M11 11v14" stroke="#E2804D" stroke-width="2"></path></svg>
    <span style="font-weight: 700; font-size: 18px; letter-spacing: 0.02em">Kroj</span>
  </div>
  <div style="font-size: 14px; color: #D8D3C9">Projekat: <strong style="color: #FFFFFF; font-weight: 600">Kuhinja Petrović — ugaona (L)</strong></div>
  <nav aria-label="Koraci projekta" style="display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto">
    <a href="Main.html" aria-current="page" style="padding: 8px 14px; border-radius: 6px; background: #F3F1EC; color: #1C1B19; text-decoration: none; font-size: 14px; font-weight: 600">1 Prostor</a>
    <a href="Nacrti.html" style="padding: 8px 14px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">2 Nacrti</a>
    <a href="Pogled3D.html" style="padding: 8px 14px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">3 3D</a>
    <a href="Element.html" style="padding: 8px 14px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">4 Elementi</a>
    <a href="KrojnaLista.html" style="padding: 8px 14px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">5 Krojna lista</a>
    <a href="Obracun.html" style="padding: 8px 14px; border-radius: 6px; color: #F3F1EC; text-decoration: none; font-size: 14px">6 Ponuda</a>
  </nav>
  <div role="group" aria-label="Jedinice" style="display: flex; border: 1px solid #5F5A52; border-radius: 6px; overflow: hidden">
    <button type="button" aria-pressed="{{mmPressed}}" onClick="{{setMm}}" style="{{mmStyle}}">mm</button>
    <button type="button" aria-pressed="{{cmPressed}}" onClick="{{setCm}}" style="{{cmStyle}}">cm</button>
  </div>
  <button type="button" aria-pressed="{{helpPressed}}" onClick="{{toggleHelp}}" style="{{helpStyle}}" title="Uključi ili isključi objašnjenja (oznake i) na svim ekranima"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M8 7v4.5M8 4.6v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>Pomoć</button>
</header>

<div role="toolbar" aria-label="Alati za crtanje" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; background: #FFFFFF; border-bottom: 1px solid #DDD8CE">
  <div role="group" aria-label="Režim" style="display: flex; gap: 4px; padding: 3px; background: #F3F1EC; border-radius: 8px">
    <button type="button" aria-pressed="{{selPressed}}" onClick="{{modeSelect}}" style="{{selStyle}}">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2l9 5-4 1.2L6.5 13z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>Izaberi i pomeri
    </button>
    <button type="button" aria-pressed="{{wallPressed}}" onClick="{{modeWall}}" style="{{wallStyle}}">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13V3h12" fill="none" stroke="currentColor" stroke-width="2.4"></path></svg>Crtaj zidove
    </button>
  </div><button type="button" class="k-tip k-r" aria-label="Izaberi i pomeri: klik bira zid, element ili prepreku; prevlačenjem pomeraš element duž zida ili na drugi zid, a prevlačenjem praznog plana pomeraš pogled. Crtaj zidove: klikći uglove prostorije redom; klik na prvi ugao zatvara prostoriju, dupli klik završava."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Izaberi i pomeri: klik bira zid, element ili prepreku; prevlačenjem pomeraš element duž zida ili na drugi zid, a prevlačenjem praznog plana pomeraš pogled. Crtaj zidove: klikći uglove prostorije redom; klik na prvi ugao zatvara prostoriju, dupli klik završava.</span></button>
  <span style="width: 1px; height: 28px; background: #DDD8CE"></span>
  <label style="display: flex; align-items: center; gap: 6px; min-height: 40px; font-size: 13px"><input type="checkbox" checked="{{snap}}" onChange="{{toggleSnap}}" style="width: 16px; height: 16px; accent-color: #B4440E">Mreža 50 mm</label><button type="button" class="k-tip" aria-label="Svi klikovi i pomeranja se zaokružuju na 50 mm. Isključi za slobodan unos na 1 mm."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Svi klikovi i pomeranja se zaokružuju na 50 mm. Isključi za slobodan unos na 1 mm.</span></button>
  <label style="display: flex; align-items: center; gap: 6px; min-height: 40px; font-size: 13px"><input type="checkbox" checked="{{ortho}}" onChange="{{toggleOrtho}}" style="width: 16px; height: 16px; accent-color: #B4440E">Pravi uglovi</label><button type="button" class="k-tip" aria-label="Zidovi se crtaju samo vodoravno ili uspravno (0° i 90°). Isključi za kose zidove."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Zidovi se crtaju samo vodoravno ili uspravno (0° i 90°). Isključi za kose zidove.</span></button>
  <label style="display: flex; align-items: center; gap: 6px; min-height: 40px; font-size: 13px"><input type="checkbox" checked="{{showUp}}" onChange="{{toggleUp}}" style="width: 16px; height: 16px; accent-color: #B4440E">Gornji elementi</label><button type="button" class="k-tip" aria-label="Prikazuje ili sakriva gornje elemente (isprekidani). Sakrij ih da lakše izabereš donje elemente ispod njih."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Prikazuje ili sakriva gornje elemente (isprekidani). Sakrij ih da lakše izabereš donje elemente ispod njih.</span></button>
  <div style="margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px">
    <button type="button" onClick="{{undo}}" disabled="{{noUndo}}" style="font: inherit; font-size: 13px; padding: 8px 12px; min-height: 40px; border-radius: 6px; border: 1px solid #DDD8CE; background: #FFFFFF; color: #1C1B19">Poništi</button><button type="button" class="k-tip" aria-label="Vraća poslednju promenu, do 60 koraka unazad."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Vraća poslednju promenu, do 60 koraka unazad.</span></button>
    <button type="button" onClick="{{clearAll}}" style="font: inherit; font-size: 13px; padding: 8px 12px; min-height: 40px; border-radius: 6px; border: 1px solid #1C1B19; background: #FFFFFF; color: #1C1B19">Novi prazan prostor</button><button type="button" class="k-tip k-l" aria-label="Briše sve i počinje crtanje zidova od nule. Može da se poništi."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Briše sve i počinje crtanje zidova od nule. Može da se poništi.</span></button>
    <button type="button" onClick="{{loadExample}}" style="font: inherit; font-size: 13px; padding: 8px 12px; min-height: 40px; border-radius: 6px; border: 1px solid #DDD8CE; background: #FFFFFF; color: #1C1B19">Učitaj primer</button>
    <a href="BrziStart.html" style="display: inline-flex; align-items: center; font-size: 13px; padding: 0 12px; min-height: 40px; border-radius: 6px; border: 1px solid #DDD8CE; color: #1C1B19; text-decoration: none">Brzi start</a>
  </div>
</div>

<div class="k-body" style="display: flex; flex: 1; min-height: 0">

  <aside aria-label="Biblioteka" class="k-lib" style="flex: 0 0 240px; min-height: 0; overflow-y: auto; background: #FFFFFF; border-right: 1px solid #DDD8CE; padding: 14px 12px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
    <p style="margin: 0; font-size: 12px; color: #5F5A52; line-height: 1.45">Prevuci na zid — element se sam zalepi uz zid i susede. Na tabletu: dodirni pa dodirni zid.</p>
    <sc-for list="{{libGroups}}" as="grp" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F5A52">{{grp.title}}<button type="button" class="k-tip k-r" aria-label="{{grp.help}}"><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">{{grp.help}}</span></button></div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{grp.items}}" as="it" hint-placeholder-count="4">
            <button type="button" draggable="true" onDragStart="{{it.dragStart}}" onDragEnd="{{it.dragEnd}}" onClick="{{it.arm}}" aria-pressed="{{it.pressed}}" title="{{it.name}}" style="{{it.style}}">
              <span style="{{it.iconStyle}}">{{it.icon}}</span>
              <span style="font-size: 12px; line-height: 1.2; text-align: center">{{it.name}}</span>
            </button>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </aside>

  <main style="flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column">
    <div style="padding: 8px 16px; font-size: 13px; background: {{hintBg}}; color: {{hintFg}}; border-bottom: 1px solid #DDD8CE; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; min-height: 40px; box-sizing: border-box">
      <strong>{{hintTitle}}</strong><span>{{hintText}}</span>
      <sc-if value="{{drafting}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{finishWall}}" style="margin-left: auto; font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; min-height: 32px; border-radius: 6px; border: 0; background: #1C1B19; color: #FFFFFF">Završi zid</button>
      </sc-if>
    </div>
    <div style="flex: 1; min-height: 0; padding: 12px; display: flex">
      <div style="flex: 1; min-width: 0; position: relative; container-type: size; display: flex; align-items: center; justify-content: center">
      <div data-plan="1" onPointerDown="{{planDown}}" onWheel="{{planWheel}}" onClick="{{planClick}}" onDoubleClick="{{planDbl}}" onPointerMove="{{planMove}}" onPointerUp="{{planUp}}" onPointerLeave="{{planLeave}}" onDragOver="{{planDragOver}}" onDragLeave="{{planDragLeave}}" onDrop="{{planDrop}}" style="{{planStyle}}">
        <svg viewBox="{{gridVB}}" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none"><defs><pattern id="kgrid" width="500" height="500" patternUnits="userSpaceOnUse"><path d="M500 0H0V500" fill="none" stroke="#E4DFD5" stroke-width="{{gridSW}}"></path></pattern></defs><rect x="-60000" y="-60000" width="120000" height="120000" fill="url(#kgrid)"></rect></svg>
        <sc-for list="{{wallBoxes}}" as="wb" hint-placeholder-count="4">
          <div onClick="{{wb.click}}" onPointerEnter="{{wb.enter}}" onPointerLeave="{{wb.leave}}" style="{{wb.style}}"></div>
        </sc-for>
        <sc-for list="{{obsBoxes}}" as="ob" hint-placeholder-count="4">
          <div onClick="{{ob.click}}" onPointerDown="{{ob.down}}" onPointerEnter="{{ob.enter}}" onPointerLeave="{{ob.leave}}" style="{{ob.style}}">{{ob.label}}</div>
        </sc-for>
        <sc-for list="{{elBoxes}}" as="eb" hint-placeholder-count="9">
          <div onPointerDown="{{eb.down}}" onClick="{{eb.click}}" onPointerEnter="{{eb.enter}}" onPointerLeave="{{eb.leave}}" style="{{eb.style}}"><span style="{{eb.labelStyle}}">{{eb.label}}</span><svg viewBox="{{eb.swVB}}" preserveAspectRatio="none" aria-hidden="true" style="{{eb.swStyle}}"><path d="{{eb.swD}}" fill="none" stroke="{{eb.swColor}}" stroke-width="{{eb.swW}}" vector-effect="non-scaling-stroke"></path></svg></div>
        </sc-for>
        <sc-for list="{{marks}}" as="mk" hint-placeholder-count="5">
          <div onClick="{{mk.click}}" onPointerDown="{{mk.down}}" onPointerEnter="{{mk.enter}}" onPointerLeave="{{mk.leave}}" style="{{mk.style}}">{{mk.label}}</div>
        </sc-for>
        <sc-for list="{{dims}}" as="dm" hint-placeholder-count="4">
          <div style="{{dm.style}}">{{dm.text}}</div>
        </sc-for>
        <sc-for list="{{verts}}" as="vx" hint-placeholder-count="4">
          <div style="{{vx.style}}"></div>
        </sc-for>
        <sc-if value="{{hasHover}}" hint-placeholder-val="{{ false }}">
          <div role="tooltip" style="{{hoverStyle}}">
            <div style="font-weight: 600; font-size: 13px">{{hoverTitle}}</div>
            <sc-for list="{{hoverLines}}" as="hl" hint-placeholder-count="2">
              <div style="font-size: 12px; color: #D8D3C9">{{hl.t}}</div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{hasGhost}}" hint-placeholder-val="{{ false }}">
          <div style="{{ghostStyle}}">{{ghostLabel}}</div>
        </sc-if>
        <sc-if value="{{hasPreview}}" hint-placeholder-val="{{ false }}">
          <div style="{{previewStyle}}"></div>
          <div style="{{previewLabelStyle}}">{{previewLabel}}</div>
        </sc-if>
        <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none">
            <div style="pointer-events: auto; background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 12px; padding: 24px; max-width: 420px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 30px rgba(28,27,25,0.08)">
              <h2 style="margin: 0; font-size: 20px">Prazan prostor</h2>
              <ol style="margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.55; color: #3D3A35">
                <li>Crtaj zidove: klikni uglove prostorije redom. Klik na prvi ugao zatvara prostoriju, dupli klik završava.</li>
                <li>Dodaj prozore, vrata, stubove, kanale i instalacije iz biblioteke.</li>
                <li>Prevuci elemente kuhinje na zidove.</li>
              </ol>
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <button type="button" onClick="{{modeWall}}" style="font: inherit; font-size: 14px; font-weight: 600; padding: 10px 14px; min-height: 44px; border-radius: 6px; border: 0; background: #B4440E; color: #FFFFFF">Počni crtanje zidova</button>
                <button type="button" onClick="{{loadExample}}" style="font: inherit; font-size: 14px; padding: 10px 14px; min-height: 44px; border-radius: 6px; border: 1px solid #DDD8CE; background: #FFFFFF; color: #1C1B19">Učitaj primer</button>
              </div>
            </div>
          </div>
        </sc-if>
      </div>
      <div role="group" aria-label="Zum" style="position: absolute; right: 8px; bottom: 8px; display: flex; align-items: center; gap: 4px; background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 8px; padding: 4px; box-shadow: 0 2px 8px rgba(28,27,25,0.08)">
        <button type="button" aria-label="Umanji" onClick="{{zoomOut}}" style="font: 600 18px 'IBM Plex Sans', sans-serif; width: 36px; height: 36px; border: 0; border-radius: 6px; background: #F3F1EC; color: #1C1B19; cursor: pointer">−</button>
        <span style="font: 12px 'IBM Plex Mono', monospace; min-width: 44px; text-align: center">{{zoomText}}</span>
        <button type="button" aria-label="Uvećaj" onClick="{{zoomIn}}" style="font: 600 18px 'IBM Plex Sans', sans-serif; width: 36px; height: 36px; border: 0; border-radius: 6px; background: #F3F1EC; color: #1C1B19; cursor: pointer">+</button>
        <button type="button" onClick="{{zoomFit}}" style="font: inherit; font-size: 13px; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: #1C1B19; color: #FFFFFF; cursor: pointer">Uklopi</button><button type="button" class="k-tip k-up k-l" aria-label="Točkić miša zumira oko kursora, − i + zumiraju sredinu, Uklopi stavlja celu prostoriju u kadar. Prevuci prazan deo plana da pomeriš pogled."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Točkić miša zumira oko kursora, − i + zumiraju sredinu, Uklopi stavlja celu prostoriju u kadar. Prevuci prazan deo plana da pomeriš pogled.</span></button>
      </div>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 20px; padding: 8px 16px; border-top: 1px solid #DDD8CE; background: #FFFFFF; font-size: 13px; color: #5F5A52">
      <span>{{countText}}</span>
      <span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace">{{cursorText}}</span>
    </div>
  </main>

  <aside aria-label="Svojstva" class="k-props" style="flex: 0 0 300px; min-height: 0; overflow-y: auto; background: #FFFFFF; border-left: 1px solid #DDD8CE; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">

    <sc-if value="{{selIsNone}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-size: 18px; display: flex; align-items: center">Prostor<button type="button" class="k-tip k-l" aria-label="Pregled projekta. Klikni zid, element ili prepreku na planu da vidiš i menjaš njihove mere ovde."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Pregled projekta. Klikni zid, element ili prepreku na planu da vidiš i menjaš njihove mere ovde.</span></button></h2>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{stats}}" as="st" hint-placeholder-count="4">
            <div style="background: #F3F1EC; border-radius: 8px; padding: 10px"><div style="font-size: 12px; color: #5F5A52">{{st.label}}</div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600">{{st.value}}</div></div>
          </sc-for>
        </div>
        <p style="margin: 0; font-size: 13px; color: #5F5A52; line-height: 1.5">Klikni zid, element ili prepreku da menjaš mere. Element se pomera prevlačenjem duž zida ili na drugi zid.</p>
      </div>
    </sc-if>

    <sc-if value="{{selIsWall}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div><div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #B4440E">Izabrano · zid</div><h2 style="margin: 4px 0 0; font-size: 20px">{{selTitle}}</h2></div>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5F5A52"><span style="display: flex; align-items: center">Dužina ({{unit}})<button type="button" class="k-tip k-r" aria-label="Unutrašnja mera zida, kako se meri metrom od ugla do ugla. Promena pomera susedni zid paralelno, pa uglovi ostaju pravi."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Unutrašnja mera zida, kako se meri metrom od ugla do ugla. Promena pomera susedni zid paralelno, pa uglovi ostaju pravi.</span></button></span><input type="text" inputMode="decimal" value="{{fWallLen}}" onChange="{{eWallLen}}" onBlur="{{cWallLen}}" onKeyDown="{{kWallLen}}" style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; padding: 9px 10px; border: 1px solid #B4440E; border-radius: 6px; color: #1C1B19"></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5F5A52"><span style="display: flex; align-items: center">Debljina ({{unit}})<button type="button" class="k-tip k-r" aria-label="Debljina zida. Utiče na položaj lica zida na koje se lepe elementi."><span aria-hidden="true">i</span><span class="k-pop" aria-hidden="true">Debljina zida. Utiče na položaj lica zida na koje se lepe elementi.</span></button></span><input type="text" inputMode="decimal" value="{{fWallTh}}" onChange="{{eWallTh}}" onBlur="{{cWallTh}}" onKeyDown="{{kWallTh}}" style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; padding: 9px 10px; border: 1px solid #DDD8CE; border-radius: 6px; color: #1C1B19"></label>
