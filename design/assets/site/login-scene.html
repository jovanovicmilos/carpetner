<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
*{box-sizing:border-box} body{margin:0;width:1480px;height:1800px;overflow:hidden;font-family:'IBM Plex Sans',sans-serif;background:#2a2a26}
.scene{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#d9d3c7 0%,#cfc6b6 45%,#b9ab95 62%)}
/* back wall: window light + shelves + pinned drawings, blurred like depth of field */
.wall{position:absolute;inset:0 0 38% 0;filter:blur(9px)}
.win{position:absolute;left:-60px;top:-40px;width:620px;height:1050px;background:linear-gradient(90deg,#fbfaf6,#f1eee6 70%,rgba(241,238,230,0));}
.win:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 120px,rgba(200,194,182,.55) 120px 132px)}
.board{position:absolute;right:60px;top:120px;width:520px;height:700px;background:#c9a77a;box-shadow:inset 0 0 0 14px #b08c5e}
.pin{position:absolute;background:#f7f5ef;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.shelf{position:absolute;left:560px;top:420px;width:380px;height:22px;background:#8a6a45}
.planks{position:absolute;left:600px;top:250px;width:300px;height:170px;background:repeating-linear-gradient(90deg,#b88a5a 0 46px,#9c7246 46px 52px,#d0a878 52px 96px,#a67a4c 96px 104px)}
.glow{position:absolute;inset:0;background:radial-gradient(60% 50% at 18% 28%,rgba(255,250,236,.75),rgba(255,250,236,0) 70%)}
/* desk */
.desk{position:absolute;left:-120px;right:-120px;top:1060px;bottom:-40px;background:linear-gradient(180deg,#ece7dd 0%,#e2dacb 40%,#cfc4b0 100%);transform-origin:50% 0;}
.deskedge{position:absolute;left:-120px;right:-120px;top:1052px;height:14px;background:linear-gradient(#f6f2ea,#d8cfbf)}
.shadow{position:absolute;border-radius:50%;background:rgba(40,32,20,.28);filter:blur(22px)}
/* monitor */
.mon{position:absolute;left:520px;top:310px;width:900px;height:560px;transform:perspective(2400px) rotateY(-16deg);transform-origin:100% 50%}
.bezel{position:absolute;inset:0;background:#141414;border-radius:12px;padding:16px 16px 22px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.screen{position:relative;width:100%;height:100%;background:#F3F1EC;overflow:hidden;border-radius:3px}
.hdr{height:42px;background:#1F2B24;display:flex;align-items:center;gap:10px;padding:0 14px;color:#F3F1EC;font-size:13px;font-weight:600}
.st{display:flex;align-items:center;gap:6px;margin-left:24px;font-size:12px;font-weight:500;color:#D8D3C9}
.st b{background:#F3F1EC;color:#1C1B19;border-radius:5px;padding:3px 8px;font-weight:600}
.tb{height:34px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid #DDD8CE;background:#FFFFFF}
.pill{height:22px;border-radius:6px;background:#F3F1EC;padding:0 10px;font-size:11px;display:flex;align-items:center;color:#3D3A35}
.pill.on{background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.view{position:absolute;left:0;right:150px;top:76px;bottom:0;background:radial-gradient(80% 80% at 50% 45%,#f7f4ee,#e6e0d4)}
.view img{position:absolute;inset:6% 4% 2% 4%;width:92%;height:92%;object-fit:contain}
.side{position:absolute;right:0;top:76px;bottom:0;width:150px;background:#FFFFFF;border-left:1px solid #DDD8CE;padding:12px;font-size:10.5px;color:#5F5A52}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 14px}
.sw i{height:26px;border-radius:5px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.stand{position:absolute;left:1030px;top:860px;width:120px;height:200px;background:linear-gradient(90deg,#1b1b1b,#2e2e2e 50%,#1b1b1b);transform:skewX(-6deg)}
.foot{position:absolute;left:930px;top:1040px;width:330px;height:38px;border-radius:50%/40%;background:linear-gradient(#2a2a2a,#151515)}
/* laptop */
.lap{position:absolute;left:60px;top:650px;width:600px;height:400px;transform:perspective(1800px) rotateX(-6deg);transform-origin:50% 100%}
.lid{position:absolute;inset:0;background:#202020;border-radius:12px 12px 4px 4px;padding:14px 14px 18px;box-shadow:0 26px 50px rgba(0,0,0,.35)}
.lscr{width:100%;height:100%;background:#FFFFFF;overflow:hidden;position:relative;border-radius:2px}
.lhdr{height:26px;background:#1F2B24;display:flex;align-items:center;gap:8px;padding:0 10px;color:#F3F1EC;font-size:10px;font-weight:600}
.lscr .sheet{position:absolute;left:12px;right:12px;top:36px;bottom:10px;border:1.5px solid #1C1B19;display:flex;flex-direction:column}
.lscr .sheet img{flex:1;min-height:0;width:100%;object-fit:contain;padding:8px}
.tblock{height:34px;border-top:1.5px solid #1C1B19;display:grid;grid-template-columns:2fr 1fr 1fr;font:600 9px 'IBM Plex Mono',monospace}
.tblock div{border-left:1px solid #1C1B19;padding:4px 6px} .tblock div:first-child{border-left:0}
.base{position:absolute;left:10px;top:1050px;width:700px;height:96px;background:linear-gradient(180deg,#3a3a3a,#1c1c1c);clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);border-radius:0 0 10px 10px}
.base:after{content:'';position:absolute;left:41%;bottom:10px;width:18%;height:22px;border-radius:4px;background:#2a2a2a}
.keys{position:absolute;inset:10px 70px 38px 70px;background:repeating-linear-gradient(90deg,#3a3a3a 0 30px,#232323 30px 34px),repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 14px,#1a1a1a 14px 18px);background-blend-mode:multiply;opacity:.9}
/* props */
.wood1{position:absolute;left:1080px;top:1140px;width:440px;height:70px;background:linear-gradient(180deg,#7b4f2e,#5e3a20);transform:rotate(-8deg);box-shadow:0 18px 30px rgba(0,0,0,.3)}
.wood1:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(176deg,rgba(255,255,255,0) 0 9px,rgba(255,255,255,.06) 9px 11px)}
.wood2{position:absolute;left:1180px;top:1080px;width:130px;height:110px;background:linear-gradient(135deg,#9a6a3e,#6f4826);transform:rotate(-8deg);box-shadow:0 14px 24px rgba(0,0,0,.3)}
.meter{position:absolute;left:880px;top:1190px;width:150px;height:62px;border-radius:10px;background:linear-gradient(#f2b630,#d9981a);transform:rotate(-6deg);box-shadow:0 12px 22px rgba(0,0,0,.3)}
.meter:after{content:'';position:absolute;left:44px;top:12px;width:62px;height:38px;border-radius:5px;background:#1f2321}
.paper{position:absolute;left:560px;top:1300px;width:640px;height:440px;background:#fbfaf6;transform:rotate(7deg);box-shadow:0 18px 40px rgba(0,0,0,.22);padding:26px;overflow:hidden}
.paper img{width:100%;opacity:.9}
.pencil{position:absolute;left:300px;top:1330px;width:300px;height:14px;border-radius:7px;background:linear-gradient(90deg,#f2c14e 0 88%,#e8c9a0 88% 96%,#333 96%);transform:rotate(-24deg);box-shadow:0 8px 12px rgba(0,0,0,.25)}
.mug{position:absolute;left:130px;top:1270px;width:130px;height:150px;border-radius:10px 10px 22px 22px;background:linear-gradient(90deg,#2E6B4E,#3d8562 55%,#25573f);box-shadow:0 22px 30px rgba(0,0,0,.3)}
.mug:before{content:'';position:absolute;left:0;right:0;top:-10px;height:22px;border-radius:50%;background:#1D4632}
.mug:after{content:'';position:absolute;right:-38px;top:36px;width:50px;height:60px;border:12px solid #2E6B4E;border-left:0;border-radius:0 30px 30px 0}
.light{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,248,230,.28),rgba(255,248,230,0) 45%),radial-gradient(120% 90% at 50% 120%,rgba(0,0,0,.25),rgba(0,0,0,0) 60%)}
</style></head><body><div class="scene">
<div class="wall"><div class="win"></div><div class="board"><div class="pin" style="left:40px;top:50px;width:200px;height:150px"></div><div class="pin" style="left:270px;top:40px;width:210px;height:280px"></div><div class="pin" style="left:60px;top:240px;width:170px;height:230px"></div></div><div class="planks"></div><div class="shelf"></div><div class="glow"></div></div>

</div></div></div>
